<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Microbiología I · Test por temas</title>
<style>
:root{--bg:#f6f2fb;--card:#fff;--ink:#22183a;--muted:#6f6488;--line:#e4dcf2;--brand:#6a35b8;--brand-ink:#fff;--accent:#e0457b;--ok:#23823f;--ok-bg:#e5f4e8;--ko:#d23c2f;--ko-bg:#fdebe8;--warn:#b7791f;--warn-bg:#fff3d9;--shadow:0 2px 0 rgba(60,30,110,.06),0 8px 20px rgba(60,30,110,.06)}
[data-theme=dark]{--bg:#130e20;--card:#1c1530;--ink:#efe9fb;--muted:#a99dc6;--line:#33294f;--brand:#b99aff;--brand-ink:#170f2b;--accent:#ff7aa6;--ok:#6fd48a;--ok-bg:#16301f;--ko:#ff8a7a;--ko-bg:#3b1d1a;--warn:#f0b53a;--warn-bg:#3a2f14;--shadow:0 6px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box}
h1,h2,.qtext,.sim-h{font-family:Georgia,"Times New Roman",serif}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:860px;margin:0 auto;padding:16px 16px 80px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
header.top h1{margin:0;font-size:1.45rem;letter-spacing:-.01em}header.top h1::after{content:'';display:block;width:34px;height:3px;background:var(--accent);margin-top:4px;border-radius:2px}
header.top small{display:block;color:var(--muted);font-size:.8rem}
.icon-btn{width:40px;height:40px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:grid;place-items:center;box-shadow:var(--shadow)}
.icon-btn svg{width:20px;height:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
h2{margin:0 0 8px;font-size:1.1rem}
.tabs{display:flex;gap:2px;padding:0;margin-bottom:16px;border:0;border-bottom:2px solid var(--line);background:transparent;border-radius:0;box-shadow:none}
.tabs button{flex:1;font:inherit;font-weight:650;font-size:.9rem;border:0;background:transparent;color:var(--muted);padding:11px 6px;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.tabs button[aria-selected=true]{background:transparent;color:var(--brand);box-shadow:inset 0 -3px 0 var(--accent);border-radius:0}
.cbadge{background:var(--ko);color:#fff;border-radius:99px;font-size:.7rem;padding:1px 7px;min-width:20px;text-align:center}
.cbadge.zero{display:none}
.live{width:8px;height:8px;border-radius:50%;background:var(--warn);display:none}.live.on{display:inline-block}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
select,input[type=number]{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:9px 12px;min-width:0;max-width:100%;flex:1 1 180px}
input[type=number]{flex:0 1 90px}
.btn{font:inherit;font-weight:650;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.danger{background:var(--ko);color:#fff;border-color:var(--ko)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px;text-align:center}
.stat b{display:block;font-size:1.35rem}.stat span{color:var(--muted);font-size:.78rem}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}.b-ok{background:var(--ok)}.b-ko{background:var(--ko)}
.progress-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.progress-top small{color:var(--muted)}
.qmeta{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.tag{background:color-mix(in srgb,var(--brand) 14%,transparent);color:var(--brand);border-radius:99px;font-size:.74rem;font-weight:700;padding:3px 10px}
.qnum{color:var(--muted);font-size:.8rem}
.qtext{font-size:1.12rem;margin:0 0 14px;line-height:1.4}
.opts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.opt{width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:6px;padding:11px 12px;display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--brand)}
.opt .ltr{flex:none;width:28px;height:28px;border-radius:5px;background:color-mix(in srgb,var(--brand) 12%,transparent);color:var(--brand);display:grid;place-items:center;font-weight:800;font-size:.85rem}
.opt.sel{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 8%,transparent)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}.opt.right .ltr{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--ko);background:var(--ko-bg)}.opt.wrong .ltr{background:var(--ko);color:#fff}
.opt.dim{opacity:.65}.opt:disabled{cursor:default}
.actions{display:flex;gap:8px;margin-top:14px;align-items:center;flex-wrap:wrap}.actions .sp{flex:1}
.hint{color:var(--muted);font-size:.82rem;margin:10px 0 0}
.fb{margin-top:16px;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.fb-head{display:flex;gap:10px;align-items:center;padding:12px 14px;font-weight:700}
.fb-head svg{width:22px;height:22px;flex:none}
.fb-head.ok{background:var(--ok-bg);color:var(--ok)}.fb-head.ko{background:var(--ko-bg);color:var(--ko)}.fb-head.bl{background:var(--warn-bg);color:var(--warn)}
.fb-body{padding:6px 14px 14px}.fb-body h3{font-size:.82rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:14px 0 6px}
.fb-body p{margin:0}
.note{display:flex;gap:8px;background:var(--warn-bg);border-radius:6px;padding:10px 12px;margin:12px 0 0;font-size:.92rem}
.note svg{width:20px;height:20px;flex:none;color:var(--warn);margin-top:2px}
ul.why{list-style:none;margin:0;padding:0;display:grid;gap:8px}
ul.why li{display:flex;gap:10px;font-size:.93rem}ul.why li.picked{background:var(--ko-bg);border-radius:5px;padding:6px 8px;margin:-6px -8px}
ul.why .l{flex:none;width:24px;height:24px;border-radius:8px;background:var(--line);display:grid;place-items:center;font-weight:800;font-size:.78rem}
ul.why .o{display:block;font-weight:650;margin-bottom:2px}
.fold>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}.fold>summary::-webkit-details-marker{display:none}
.fold>summary::after{content:'▾';color:var(--muted);transition:transform .2s;margin-left:auto}.fold:not([open])>summary::after{transform:rotate(-90deg)}
.fold>summary small{color:var(--muted);margin-left:8px}
.grid{display:flex;flex-wrap:wrap;gap:6px}
.gcell{width:34px;height:34px;border-radius:5px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.82rem;font-weight:650;cursor:pointer}
.gcell.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}.gcell.ko{background:var(--ko-bg);border-color:var(--ko);color:var(--ko)}
.gcell.cur{outline:2px solid var(--brand);outline-offset:1px}.gcell.fl{box-shadow:inset 0 -4px 0 var(--warn)}.gcell.sel{background:color-mix(in srgb,var(--brand) 18%,transparent);border-color:var(--brand)}
.sim-h{margin:4px 0 6px;font-size:1.3rem}.sim-p{margin:0 0 14px;color:var(--muted)}
.cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.cfg label{display:grid;gap:4px;font-size:.82rem;color:var(--muted)}.cfg select,.cfg input{flex:none;width:100%}
.hero{display:flex;gap:20px;align-items:center;flex-wrap:wrap}.ringbox{position:relative;width:120px;height:120px}.ringbox svg{width:100%;height:100%}
.ringbox .n{position:absolute;inset:0;display:grid;place-content:center;text-align:center}.ringbox .n b{font-size:1.5rem;line-height:1}.ringbox .n span{font-size:.72rem;color:var(--muted)}
.hero .tx h2{margin:0 0 4px;font-size:1.25rem}.hero .tx p{margin:0 0 4px;color:var(--muted)}
.weak{display:grid;gap:8px}.wrow{display:grid;grid-template-columns:1fr 160px 52px;gap:10px;align-items:center;font-size:.88rem}
.sbar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;display:flex}.sbar i{display:block;height:100%}.sbar .g{background:var(--ok)}.sbar .r{background:var(--ko)}.sbar .n{background:transparent}
.wrow .pc{text-align:right;color:var(--muted)}
.rline{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.empty{text-align:center;color:var(--muted)}.empty h2{color:var(--ink)}
.xbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:12px;box-shadow:var(--shadow)}
.xbar .sp{flex:1}.timer{font-variant-numeric:tabular-nums;font-weight:800;background:var(--line);border-radius:5px;padding:5px 11px}.timer.low{background:var(--warn-bg);color:var(--warn)}.timer.crit{background:var(--ko-bg);color:var(--ko)}
.hist{display:grid;gap:8px}.hrow{display:flex;justify-content:space-between;gap:8px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:10px 12px;cursor:pointer;background:var(--card);color:var(--ink);font:inherit;text-align:left;width:100%}
.hrow b{font-variant-numeric:tabular-nums}
details.rv{border:1px solid var(--line);border-radius:6px;margin-bottom:8px;background:var(--card)}
details.rv>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
details.rv>summary::-webkit-details-marker{display:none}
details.rv .st{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:.75rem;font-weight:800}
details.rv .st.ok{background:var(--ok)}details.rv .st.ko{background:var(--ko)}details.rv .st.bl{background:var(--warn)}
details.rv .rvb{padding:0 14px 14px}
.modal{position:fixed;inset:0;background:rgba(10,14,30,.55);display:none;place-items:center;padding:20px;z-index:50}.modal.on{display:grid}
.modal .box{background:var(--card);border-radius:8px;max-width:400px;width:100%;padding:22px;border:1px solid var(--line)}
.modal h2{margin:0 0 6px}.modal p{margin:0 0 18px;color:var(--muted)}.modal .row{display:flex;gap:10px;justify-content:flex-end}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}.seg button{border:0;background:var(--card);color:var(--ink);font:inherit;padding:9px 14px;cursor:pointer}.seg button[aria-pressed=true]{background:var(--brand);color:var(--brand-ink)}
.kbd{font-size:.72rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 6px;color:var(--muted)}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.qcard{animation:up .25s}.qcard.x{animation:none}
@media (max-width:560px){
 .wrap{padding:12px 12px 70px}.stats{grid-template-columns:repeat(2,1fr)}.qtext{font-size:1.05rem}
 .tabs{gap:3px;padding:4px}.tabs button{font-size:.68rem;padding:10px 1px;gap:3px}
 .actions .btn{flex:1 1 auto;justify-content:center}.kbd{display:none}.wrow{grid-template-columns:1fr 70px 40px}.hero{justify-content:center;text-align:center}
 .xbar{gap:6px;padding:8px}.card{padding:14px}
}
</style>
</head>

<script id="bank" type="application/json">[{"id": 1, "t": "Tema 1 · Historia de la Microbiología", "b": 1, "q": "¿Dónde se encuentran los microorganismos?", "o": ["En casi todos los hábitats: suelo, agua, aire, seres vivos y el cuerpo humano.", "Solo en el suelo y en el agua, donde hay abundante materia orgánica de forma habitual.", "Solo en el interior de organismos enfermos, donde causan infección.", "Solo en ambientes con oxígeno, ya que todos necesitan respirar aire."], "a": 0, "ok": "Son ubicuos: intervienen en los ciclos de los nutrientes en la naturaleza y forman parte de nuestra microbiota.", "ko": {"1": "También viven en el aire y en otros seres vivos.", "2": "La mayoría no causa enfermedad y vive libre o en simbiosis.", "3": "Muchos viven en anaerobiosis."}, "n": "Respuesta basada en el enfoque general del tema (papel ambiental de los microorganismos)."}, {"id": 2, "t": "Tema 1 · Historia de la Microbiología", "b": 1, "q": "¿Cuáles son los microorganismos más simples?", "o": ["Los protozoos, por su tamaño pequeño y su vida en medios acuáticos en general.", "Los virus, viroides y priones, que carecen de organización celular.", "Los hongos, por tener una estructura filamentosa sencilla.", "Las arqueas, por carecer de núcleo y de orgánulos con membrana."], "a": 1, "ok": "Carecen de organización celular. Los virus son ácido nucleico con cápsida proteica, los viroides son ARN y los priones son proteínas.", "ko": {"0": "Son eucariotas con organización celular compleja.", "2": "Son eucariotas con organización celular compleja.", "3": "Son procariotas, es decir, células completas."}, "n": "La pregunta es ambigua: según los apuntes (tema 2) los más simples en estructura son los acelulares. Si tu profesor se refiere a células, la respuesta serían los procariotas."}, {"id": 3, "t": "Tema 1 · Historia de la Microbiología", "b": 1, "q": "¿Por qué los microorganismos no se descubrieron hasta Leeuwenhoek, si ya existían microscopios?", "o": ["Porque los microorganismos aún no existían en esa época remota.", "Porque el microscopio electrónico no se había desarrollado todavía.", "Los microscopios eran de poca calidad y él logró lentes de 200 aumentos.", "Porque se creía que eran visibles a simple vista si se miraba bien."], "a": 2, "ok": "Leeuwenhoek consiguió una lente de gran calidad (que no desveló) y observó los «animálculos». Además, nadie creyó que tuvieran importancia para el hombre.", "ko": {"0": "Existían desde mucho antes; lo que faltaba era poder verlos.", "1": "Este se desarrolló a mediados del siglo XX, mucho después.", "3": "Son menores que la capacidad de resolución del ojo."}, "n": ""}, {"id": 4, "t": "Tema 1 · Historia de la Microbiología", "b": 1, "q": "¿Son importantes los microorganismos para el hombre?", "o": ["Solo desde el punto de vista clínico, por las enfermedades que causan.", "Solo industrial y clínico, pero no tienen papel ecológico.", "No, porque casi ninguno tiene relación con el hombre.", "Sí, en los cuatro: industrial, ecológico, clínico y otros motivos."], "a": 3, "ok": "Sirven en la industria (fermentaciones), en los ciclos de nutrientes, causan o previenen enfermedades y se usan como herramienta en biología molecular y biotecnología.", "ko": {"0": "También son esenciales ecológica e industrialmente.", "1": "El papel ecológico (ciclos de C, N, O…) es fundamental.", "2": "Afectan al hombre de forma directa e indirecta en todos esos ámbitos."}, "n": ""}, {"id": 5, "t": "Tema 1 · Historia de la Microbiología", "b": 1, "q": "¿Qué es una fermentación?", "o": ["Oxidación parcial con donador y aceptor orgánicos.", "Oxidación total de la glucosa hasta CO2 con aceptor exógeno.", "Proceso exclusivo de células eucariotas que necesita oxígeno.", "Fijación del CO2 atmosférico en materia orgánica por autótrofos."], "a": 0, "ok": "No interviene la cadena de transporte de electrones ni el oxígeno, y el aceptor es endógeno (pertenece a la propia bacteria).", "ko": {"1": "Eso es la respiración.", "2": "Es típica de microorganismos y no necesita oxígeno.", "3": "Eso es la biosíntesis de los autótrofos."}, "n": ""}, {"id": 6, "t": "Tema 1 · Historia de la Microbiología", "b": 1, "q": "¿Pueden vivir los microorganismos en anaerobiosis?", "o": ["No, todos los microorganismos necesitan oxígeno para vivir.", "Sí, fermentando o usando un aceptor distinto del oxígeno.", "Solo las arqueas, porque las bacterias siempre son aerobias.", "Solo las que forman endosporas, que resisten la falta de aire."], "a": 1, "ok": "Los anaerobios usan aceptores distintos del O2 (nitrato, sulfato, fumarato…) o fermentan.", "ko": {"0": "Hay anaerobios estrictos.", "2": "También hay bacterias anaerobias.", "3": "Las endosporas son resistencia, no un modo de obtener energía."}, "n": ""}, {"id": 7, "t": "Tema 1 · Historia de la Microbiología", "b": 1, "q": "La pasteurización ¿es un método de esterilización?", "o": ["Sí, porque elimina todas las formas de vida del producto.", "Sí, siempre que se caliente a 121 °C durante 15 minutos.", "No: elimina los indeseables a 68 °C.", "Sí, porque se repite tres días seguidos con incubaciones."], "a": 2, "ok": "Se desarrolló para conservar vino y cerveza. La esterilización exige destruir todas las formas, incluidas las endosporas (121 °C).", "ko": {"0": "Las endosporas resisten ese tratamiento.", "1": "A 121 °C es el autoclave, no la pasteurización.", "3": "Eso describe la tindalización."}, "n": "Que la pasteurización no esteriliza es conocimiento general; los apuntes solo dan el método (68 °C, 10 min)."}, {"id": 8, "t": "Tema 1 · Historia de la Microbiología", "b": 1, "q": "¿Existen cultivos puros de microorganismos en la naturaleza?", "o": ["Sí, porque cada hábitat natural contiene una única especie en general.", "Sí, en el suelo y en el agua dulce de ríos y lagos.", "Sí, en el intestino humano, que tiene una sola especie.", "No, son mixtas; el cultivo puro se logra aislando en el laboratorio."], "a": 3, "ok": "Si en una placa de Petri hay colonias de distintos tipos, el cultivo no es puro. Cada colonia procede de una sola bacteria.", "ko": {"0": "Las poblaciones naturales son mixtas.", "1": "También allí hay muchas especies.", "2": "La microbiota es una comunidad diversa."}, "n": ""}, {"id": 9, "t": "Tema 1 · Historia de la Microbiología", "b": 1, "q": "¿Qué significa ser el agente etiológico de una enfermedad?", "o": ["Ser el microorganismo causante de una enfermedad, según los postulados de Koch.", "Ser cualquier microorganismo presente en el enfermo en ese momento.", "Ser el microorganismo que causa los síntomas de otra enfermedad.", "Ser el microorganismo que protege al enfermo frente a la infección."], "a": 0, "ok": "Koch fijó cuatro principios: presencia en los enfermos, aislamiento en cultivo puro, producción de la enfermedad en un animal y nuevo aislamiento.", "ko": {"1": "Puede estar sin ser la causa.", "2": "El agente etiológico es el de esa enfermedad concreta.", "3": "Eso sería un efecto protector, no la causa."}, "n": ""}, {"id": 10, "t": "Tema 1 · Historia de la Microbiología", "b": 1, "q": "Entre los procesos metabólicos exclusivos de los microorganismos se encuentran:", "o": ["Respiración aerobia, glucólisis y síntesis de proteínas celulares en general.", "Metanogénesis, metabolismo quimioautótrofo y fijación de nitrógeno.", "Fotosíntesis oxigénica, mitosis y meiosis de células eucariotas.", "Digestión, circulación y excreción de sustancias de desecho."], "a": 1, "ok": "Los apuntes los incluyen entre los procesos en los que intervienen los microorganismos (junto con la fotosíntesis y el ciclo de los nutrientes).", "ko": {"0": "Son procesos comunes a muchos seres vivos.", "2": "La mitosis y la meiosis no son procesos microbianos exclusivos.", "3": "No son procesos metabólicos de este tipo."}, "n": "La fotosíntesis también la realizan plantas y algas; por eso no se cuenta como exclusiva."}, {"id": 11, "t": "Tema 1 · Historia de la Microbiología", "b": 1, "q": "¿Qué grupo de procariotas realiza la metanogénesis?", "o": ["Las cianobacterias, bacterias que hacen fotosíntesis oxigénica.", "Las enterobacterias, bacterias quimioheterótrofas intestinales.", "Las arqueas, procariotas distintos de las bacterias.", "Los actinomicetos, bacterias filamentosas del suelo."], "a": 2, "ok": "En 1977 se descubrió que la metanogénesis (CO2 + H2 → CH4) la realizan solo las arqueas.", "ko": {"0": "Hacen fotosíntesis oxigénica.", "1": "Son bacterias quimioheterótrofas.", "3": "Son bacterias filamentosas, no metanógenas."}, "n": ""}, {"id": 12, "t": "Tema 1 · Historia de la Microbiología", "b": 1, "q": "¿Qué criterio se sigue para dar nombre a las fermentaciones?", "o": ["El nombre del científico que la descubrió por primera vez.", "El tipo de microscopio con el que se observaron los microbios.", "El número de moléculas de ATP que se producen en total.", "El producto final principal que se forma (láctica, alcohólica…)."], "a": 3, "ok": "Los tipos de fermentación se nombran según el compuesto orgánico reducido que se forma.", "ko": {"0": "No se nombran así.", "1": "No tiene relación.", "2": "No se usa como criterio de nombre."}, "n": "Criterio habitual en microbiología; los apuntes del tema 7 lo ilustran con ejemplos."}, {"id": 13, "t": "Tema 1 · Historia de la Microbiología", "b": 1, "q": "¿Por qué es tan importante que algunas bacterias realicen la fotosíntesis?", "o": ["Producen al menos el 50 % del oxígeno terrestre y fijan CO2.", "Son las únicas que producen glucosa en toda la naturaleza.", "Así dejan de necesitar nutrientes como nitrógeno o fósforo.", "Porque la fotosíntesis bacteriana produce metano como producto."], "a": 0, "ok": "Synechococcus, por ejemplo, es responsable del 25 % de la fotosíntesis de los medios acuáticos y además fija nitrógeno atmosférico.", "ko": {"1": "Plantas y algas también la producen.", "2": "Siguen necesitando N, P, S y otros nutrientes.", "3": "El metano lo produce la metanogénesis."}, "n": ""}, {"id": 14, "t": "Tema 1 · Historia de la Microbiología", "b": 1, "q": "¿Qué seres vivos captan el CO2?", "o": ["Solo las plantas terrestres, que son los únicos fotosintéticos en general.", "Los autótrofos: plantas, algas, cianobacterias y bacterias autótrofas.", "Todos los heterótrofos, que lo usan como fuente de carbono.", "Solo los animales, mediante su respiración celular."], "a": 1, "ok": "Fijan CO2 y lo convierten en materia orgánica (ciclo de Calvin-Benson, entre otros).", "ko": {"0": "También lo hacen muchos microorganismos.", "2": "Los heterótrofos usan carbono orgánico.", "3": "Los animales no fijan CO2."}, "n": ""}, {"id": 15, "t": "Tema 1 · Historia de la Microbiología", "b": 1, "q": "Cuando Pasteur demostró que las fermentaciones las producen microorganismos, comenzó a desarrollarse:", "o": ["La inmunología humana moderna, basada en el uso de anticuerpos.", "La microscopía electrónica, para observar virus y estructuras.", "La microbiología industrial y de transformación de la materia.", "La virología, centrada en el estudio de los virus."], "a": 2, "ok": "Pasteur describió que cada tipo de microorganismo realiza una fermentación distinta y ello abrió el estudio de los procesos de transformación de la materia.", "ko": {"0": "Vino después, con las vacunas.", "1": "Se desarrolló a mediados del siglo XX.", "3": "Se profundizó en ella tras el microscopio electrónico."}, "n": "Los apuntes no dicen el nombre exacto de la rama; encaja con la microbiología industrial y de alimentos."}, {"id": 16, "t": "Tema 1 · Historia de la Microbiología", "b": 1, "q": "¿Qué es una tinción sencilla y una diferencial?", "o": ["La sencilla usa calor y la diferencial se hace sin calor.", "La sencilla solo tiñe esporas y la diferencial solo la pared.", "Son la misma técnica con distinto nombre según el autor.", "La sencilla usa un colorante."], "a": 3, "ok": "La sencilla revela forma y tamaño. La diferencial usa varios reactivos y separa grupos según su pared.", "ko": {"0": "El calor no es el criterio.", "1": "No es esa la diferencia.", "2": "Tienen objetivos distintos."}, "n": ""}, {"id": 17, "t": "Tema 2 · Clasificación y organización celular", "b": 2, "q": "¿Qué es un plásmido?", "o": ["ADN extracromosómico circular.", "Un orgánulo rodeado de membrana propia dentro del citoplasma.", "El cromosoma principal que contiene la información esencial.", "Una proteína estructural que forma parte de la pared celular."], "a": 0, "ok": "Es de menor tamaño que el cromosoma y no está en todas las procariotas. Puede llevar genes de resistencia o virulencia.", "ko": {"1": "Las procariotas no tienen orgánulos con membrana.", "2": "El plásmido es adicional al cromosoma.", "3": "Es ADN."}, "n": ""}, {"id": 18, "t": "Tema 2 · Clasificación y organización celular", "b": 2, "q": "¿Qué es una endospora?", "o": ["Una forma de reproducción que multiplica el número de bacterias.", "Una célula diferenciada de reposo y resistencia, no reproductiva.", "Un tipo de plásmido con genes de resistencia a antibióticos.", "Una estructura propia de los virus que infectan bacterias."], "a": 1, "ok": "Cada célula genera una sola endospora, con hipometabolia y gran resistencia al calor y la desecación.", "ko": {"0": "No aumenta el número de células.", "2": "Es una estructura diferenciada, no ADN.", "3": "Es de ciertas bacterias Gram positivas."}, "n": ""}, {"id": 19, "t": "Tema 2 · Clasificación y organización celular", "b": 2, "q": "¿Cuál de estos componentes de las procariotas NO es imprescindible para su viabilidad?", "o": ["El cromosoma, que contiene la información genética esencial.", "Los ribosomas, necesarios para la síntesis de proteínas.", "Los plásmidos, que no son necesarios para la viabilidad.", "La membrana citoplasmática, estructura vital de la célula."], "a": 2, "ok": "La célula puede vivir sin ellos, igual que sin cápsula, flagelos, fimbrias o endosporas.", "ko": {"0": "Contiene la información esencial.", "1": "Son necesarios para la síntesis de proteínas.", "3": "Es una estructura vital."}, "n": ""}, {"id": 20, "t": "Tema 2 · Clasificación y organización celular", "b": 2, "q": "¿Cuál de estos grupos carece de organización celular?", "o": ["Las bacterias, que son células procariotas sencillas.", "Las arqueas, que son células procariotas extremófilas.", "Los hongos, que son células eucariotas con núcleo.", "Los virus, viroides y priones, entidades acelulares."], "a": 3, "ok": "Son entidades biológicas acelulares; los virus son parásitos intracelulares estrictos.", "ko": {"0": "Son células procariotas.", "1": "Son procariotas.", "2": "Son células eucariotas."}, "n": ""}, {"id": 21, "t": "Tema 2 · Clasificación y organización celular", "b": 2, "q": "¿Se pueden cultivar los viroides y los priones con los mismos métodos que las bacterias?", "o": ["No, carecen de metabolismo propio y necesitan una célula hospedadora.", "Sí, en placa de Petri con agar nutritivo, como las bacterias.", "Sí, si se les añade glucosa y sales minerales al medio.", "Sí, si se incuban a 37 °C durante 24 horas."], "a": 0, "ok": "Los virus son parásitos intracelulares estrictos y las entidades acelulares no se multiplican por sí mismas en un medio de cultivo.", "ko": {"1": "Esos medios son para células.", "2": "No tienen metabolismo propio.", "3": "La temperatura no resuelve su dependencia de la célula."}, "n": "Respuesta apoyada en lo que dicen los apuntes sobre los virus; viroides y priones se infieren por analogía."}, {"id": 22, "t": "Tema 3 · Pared, membrana y transporte", "b": 3, "q": "Un cocobacilo, ¿es un coco o un bacilo?", "o": ["Es un coco, porque su forma es casi esférica.", "Ninguno: es una forma intermedia entre coco y bacilo.", "Es un bacilo, porque es siempre alargado y cilíndrico.", "Es un coco con flagelos, que lo hacen más alargado."], "a": 1, "ok": "Los apuntes lo incluyen como una forma celular propia, junto a coco, bacilo, vibrio y espiral.", "ko": {"0": "Es más alargado que un coco.", "2": "Es más corto que un bacilo.", "3": "Los flagelos no definen la forma."}, "n": ""}, {"id": 23, "t": "Tema 3 · Pared, membrana y transporte", "b": 3, "q": "¿En qué se diferencian las espiroquetas de las bacterias espirales (espirilos)?", "o": ["Las espiroquetas son eucariotas y las espirales procariotas.", "Las espirales carecen de pared celular, a diferencia de las otras.", "Tienen más vueltas de espira y flagelos periplásmicos.", "Las espiroquetas son cocos que se agrupan en cadenas."], "a": 2, "ok": "Los apuntes las describen como formas espirales «con más vueltas». Su flagelación interna les permite moverse en medios de alta viscosidad como una broca.", "ko": {"0": "Todas son procariotas.", "1": "Tienen pared como el resto.", "3": "Tienen forma de espiral."}, "n": "Parte de la respuesta (flagelos periplásmicos) viene del tema 4."}, {"id": 24, "t": "Tema 3 · Pared, membrana y transporte", "b": 3, "q": "¿Qué diferencia existe entre un actinomiceto y un hongo filamentoso?", "o": ["El actinomiceto es un hongo con pared de quitina.", "El hongo es procariota y el actinomiceto es eucariota.", "Ninguna: ambos son hongos filamentosos con micelio.", "El actinomiceto es una bacteria y el hongo es eucariota."], "a": 3, "ok": "Los actinomicetos forman hifas y micelios, pero son bacterias; por eso no tienen núcleo ni esteroles propios de hongos.", "ko": {"0": "Es una bacteria con mureína.", "1": "Es al revés.", "2": "Los actinomicetos son bacterias."}, "n": ""}, {"id": 25, "t": "Tema 3 · Pared, membrana y transporte", "b": 3, "q": "¿Qué característica distingue a la pared de las bacterias Gram negativas de las Gram positivas?", "o": ["Capa fina de peptidoglicano y membrana externa con LPS.", "Capa gruesa de peptidoglicano con ácidos teicoicos abundantes.", "Ausencia total de pared celular, como en los micoplasmas.", "Una pared de pseudomureína, propia de algunas arqueas."], "a": 0, "ok": "Las Gram positivas tienen una capa gruesa de peptidoglicano, sin membrana externa, con ácidos teicoicos.", "ko": {"1": "Eso describe a las Gram positivas.", "2": "Eso ocurre en los micoplasmas.", "3": "Es propia de algunas arqueas."}, "n": "Ojo: en un punto de los apuntes se dice que las Gram positivas «también poseen membrana externa»; es una errata, la membrana externa es propia de las Gram negativas."}, {"id": 26, "t": "Tema 3 · Pared, membrana y transporte", "b": 3, "q": "En la tinción de Gram, ¿de qué depende el resultado?", "o": ["Solo de la cantidad de mureína de la pared celular.", "De la composición y estructura de toda la pared celular.", "Del tamaño de la bacteria y de su forma celular.", "De la presencia o ausencia de flagelos en la superficie en general."], "a": 1, "ok": "Los apuntes lo dicen así: la distinta pared es responsable de la respuesta. Con el alcohol, la Gram positiva se deshidrata y retiene el cristal violeta.", "ko": {"0": "Interviene toda la pared, incluida la membrana externa.", "2": "No es el factor determinante.", "3": "No influye."}, "n": ""}, {"id": 27, "t": "Tema 3 · Pared, membrana y transporte", "b": 3, "q": "¿Por qué la saliva de los mamíferos tiene propiedades antimicrobianas?", "o": ["Contiene ácidos micólicos, que destruyen la pared bacteriana.", "Contiene penicilina, que bloquea la transpeptidación de la mureína.", "Contiene lisozima, que rompe el enlace NAM-NAG del peptidoglicano.", "Tiene un pH que inactiva los ribosomas de las bacterias."], "a": 2, "ok": "Al romperse ese enlace la pared pierde rigidez y la bacteria se lisa por la presión osmótica; actúa sobre todo en Gram positivas.", "ko": {"0": "Esos están en la pared de las micobacterias.", "1": "Los β-lactámicos son antibióticos de origen microbiano, no de la saliva.", "3": "No es el mecanismo descrito."}, "n": "La relación entre saliva y lisozima es conocimiento general; los apuntes explican solo la lisozima."}, {"id": 28, "t": "Tema 3 · Pared, membrana y transporte", "b": 3, "q": "¿Por qué los antibióticos β-lactámicos son tan buenos fármacos?", "o": ["Actúan sobre los ribosomas 80S de las células humanas.", "Dañan el ADN de las células del hospedador humano.", "Eliminan las endosporas de las bacterias que las forman.", "Inhiben la transpeptidación de la mureína."], "a": 3, "ok": "Se unen a las PBP; la mureína queda menos rígida y la célula se lisa. Nuestras células no tienen mureína, de ahí su toxicidad selectiva.", "ko": {"0": "Actúan sobre la pared.", "1": "No es el mecanismo.", "2": "No actúan sobre ellas."}, "n": ""}, {"id": 29, "t": "Tema 3 · Pared, membrana y transporte", "b": 3, "q": "Si un antibiótico tiene una alta toxicidad selectiva, significa que:", "o": ["Daña al microorganismo sin dañar las células del hospedador.", "Es tóxico para todas las células por igual, sin distinción.", "Solo es eficaz cuando se administra en dosis muy altas.", "Mata únicamente a las bacterias Gram negativas del paciente en general."], "a": 0, "ok": "Por ejemplo, la mureína (solo en bacterias) o los ribosomas 70S. Así es eficaz y poco tóxico para el paciente.", "ko": {"1": "Eso es lo contrario.", "2": "No tiene que ver con la dosis.", "3": "No es esa la definición."}, "n": ""}, {"id": 30, "t": "Tema 3 · Pared, membrana y transporte", "b": 3, "q": "Si las bacterias Gram positivas no tienen membrana externa, ¿cómo producen efectos tóxicos?", "o": ["Liberan LPS procedente de su membrana externa, que es tóxico.", "Secretan exotoxinas al exterior mediante sistemas de secreción.", "Liberan endotoxina (lípido A) cuando se multiplican en tejidos.", "No pueden producir ninguna toxina que afecte al hospedador."], "a": 1, "ok": "La toxicidad de la membrana externa es el lípido A (endotoxina), exclusivo de Gram negativas. Las Gram positivas actúan con toxinas liberadas.", "ko": {"0": "El LPS es de la membrana externa de Gram negativas.", "2": "No tienen lípido A.", "3": "Sí pueden, secretadas."}, "n": "Respuesta construida con lo que dice el tema 3 sobre LPS y sistemas de secreción."}, {"id": 31, "t": "Tema 3 · Pared, membrana y transporte", "b": 3, "q": "Si las bacterias Gram positivas no tienen LPS, ¿cuáles serán sus antígenos más superficiales?", "o": ["El antígeno O, la parte variable de los lipopolisacáridos.", "Las porinas, canales de la membrana externa de la pared.", "Los ácidos teicoicos y lipoteicoicos.", "El lípido A, parte fija de la endotoxina de la membrana."], "a": 2, "ok": "Los teicoicos son polímeros de ribitol o glicerol fosfato; los lipoteicoicos se unen a lípidos de la membrana.", "ko": {"0": "Es parte del LPS de Gram negativas.", "1": "Son de la membrana externa de Gram negativas.", "3": "Es la endotoxina de Gram negativas."}, "n": ""}, {"id": 32, "t": "Tema 3 · Pared, membrana y transporte", "b": 3, "q": "¿Por qué no se lisan los micoplasmas si no tienen pared celular?", "o": ["Tienen una pared muy gruesa de mureína que los protege.", "Tienen una cápsula de ácidos micólicos que los refuerza.", "Viven siempre en medios hipertónicos que evitan que entre agua.", "Su membrana tiene esteroles, que le dan fuerza y rigidez."], "a": 3, "ok": "Son procariotas pequeños, pleomórficos, del phylum Mollicutes. Los esteroles refuerzan la membrana.", "ko": {"0": "No tienen pared.", "1": "Esa es la pared de las micobacterias.", "2": "Lo que les protege es su membrana reforzada."}, "n": ""}, {"id": 33, "t": "Tema 3 · Pared, membrana y transporte", "b": 3, "q": "¿Por qué las bacterias transportan casi todos los nutrientes en contra del gradiente de concentración?", "o": ["Las permeasas usan energía para concentrar nutrientes dentro.", "La difusión simple es más rápida que cualquier otro transporte.", "Carecen de membrana citoplasmática que regule la entrada.", "El agua entra por ósmosis arrastrando consigo los nutrientes."], "a": 0, "ok": "Las permeasas se saturan, son específicas y cambian de conformación para captar el nutriente y liberarlo en el citoplasma.", "ko": {"1": "No permite acumular contra gradiente.", "2": "Tienen membrana citoplasmática.", "3": "Eso es el agua, no los nutrientes."}, "n": "Se razona con la descripción de las permeasas; la causa «el medio está diluido» es una inferencia habitual."}, {"id": 34, "t": "Tema 3 · Pared, membrana y transporte", "b": 3, "q": "En la translocación de grupo (sistema fosfotransferasa), ¿por qué el gasto de energía es «útil»?", "o": ["No se consume ni ATP ni fosfoenolpiruvato en el proceso.", "El nutriente se fosforila al entrar y queda listo para metabolizarse.", "El nutriente entra sin sufrir ninguna modificación química de forma habitual.", "El transporte siempre va a favor del gradiente, sin gasto."], "a": 1, "ok": "Un solo gasto hace dos cosas: transportar y activar. La enzima transmembranosa cede el fosfato a la glucosa.", "ko": {"0": "Sí consume fosfoenolpiruvato.", "2": "Entra modificado.", "3": "La clave es la modificación química."}, "n": "El texto dice que el gasto es «útil»; la explicación de por qué viene de lo que se describe del sistema."}, {"id": 35, "t": "Tema 3 · Pared, membrana y transporte", "b": 3, "q": "¿Cómo inyectan algunas bacterias sus toxinas en las células hospedadoras?", "o": ["Con el sistema de secreción Sec, que exporta exoenzimas.", "A través de las porinas de la membrana externa celular.", "Con el sistema de secreción de tipo III.", "Mediante los flagelos, que las inyectan al girar."], "a": 2, "ok": "Es una función de la membrana citoplasmática: transporta proteínas al exterior. El sistema Sec exporta exoenzimas y enzimas del periplasma.", "ko": {"0": "El Sec exporta exoenzimas y proteínas de membrana.", "1": "Son canales de pequeñas moléculas hidrofílicas.", "3": "Los flagelos son para movilidad."}, "n": "Según los apuntes, el tipo III se asocia a exotoxinas."}, {"id": 36, "t": "Tema 4 · Citoplasma, nucleoide y flagelos", "b": 4, "q": "¿Por qué en las procariotas transcripción y traducción pueden ocurrir a la vez?", "o": ["Tienen un núcleo con poros que permite el paso inmediato.", "Usan ribosomas 80S, más rápidos que los de otras células.", "El ADN está dentro de una vacuola junto a los ribosomas.", "No hay membrana nuclear: los ribosomas se unen al ARNm naciente."], "a": 3, "ok": "A medida que el ADN se copia a ARNm, ya se unen los ribosomas y comienza la síntesis de la proteína.", "ko": {"0": "No tienen núcleo.", "1": "Sus ribosomas son 70S.", "2": "No hay vacuolas con membrana."}, "n": ""}, {"id": 37, "t": "Tema 4 · Citoplasma, nucleoide y flagelos", "b": 4, "q": "¿Por qué los polisomas hacen la síntesis de proteínas tan eficaz?", "o": ["Varios ribosomas leen a la vez un ARNm y hacen copias.", "Aumentan el tamaño del ribosoma para sintetizar más rápido.", "Transcriben el ADN a ARN con mayor eficacia que la ARN polimerasa.", "Sintetizan lípidos y proteínas en un mismo complejo."], "a": 0, "ok": "Los polisomas son conjuntos de ribosomas que leen simultáneamente un solo ARNm.", "ko": {"1": "No cambian su tamaño.", "2": "Los ribosomas traducen.", "3": "Sintetizan proteínas."}, "n": ""}, {"id": 38, "t": "Tema 4 · Citoplasma, nucleoide y flagelos", "b": 4, "q": "¿Cómo cabe 1 mm de ADN en una procariota de 2 × 0,5 µm?", "o": ["Se corta en fragmentos pequeños que se guardan por separado.", "Está superenrollado negativamente y en dominios.", "Se enrolla alrededor de histonas formando nucleosomas.", "Se guarda dentro de un núcleo rodeado de membrana."], "a": 1, "ok": "La estructura en dominios evita la relajación total. No tiene histonas y se asocia a proteínas y ARN.", "ko": {"0": "Es una sola molécula circular.", "2": "Las procariotas no tienen histonas.", "3": "No hay núcleo."}, "n": ""}, {"id": 39, "t": "Tema 4 · Citoplasma, nucleoide y flagelos", "b": 4, "q": "¿Qué mecanismo permite difundir la resistencia a antibióticos entre bacterias?", "o": ["La mitosis, que reparte los genes entre células hijas.", "La esporulación, que protege el ADN de los antibióticos.", "La conjugación de plásmidos R conjugativos mediante el pilus.", "La transcripción, que copia los genes de resistencia."], "a": 2, "ok": "Los plásmidos con genes de resistencia suelen ser conjugativos y pueden transferirse incluso entre especies distintas.", "ko": {"0": "Las procariotas no tienen mitosis.", "1": "Es resistencia, no transferencia de genes.", "3": "Es la síntesis de ARN."}, "n": ""}, {"id": 40, "t": "Tema 4 · Citoplasma, nucleoide y flagelos", "b": 4, "q": "Si una bacteria no tiene flagelos, ¿cómo puede situarse en la zona del medio acuático con el oxígeno o la luz que necesita?", "o": ["Con cápsulas de mureína que les dan flotabilidad.", "Con gránulos de glucógeno que las hacen pesar más en general.", "Con ribosomas libres que se orientan hacia la luz.", "Con vacuolas de gas (flotan) o magnetosomas (magnetotaxis)."], "a": 3, "ok": "Las vacuolas de gas permiten flotar a la profundidad adecuada. Los magnetosomas con magnetita orientan a bacterias microaerófilas o anaerobias.", "ko": {"0": "No sirven para posicionarse.", "1": "Son reserva.", "2": "No tienen esa función."}, "n": ""}, {"id": 41, "t": "Tema 4 · Citoplasma, nucleoide y flagelos", "b": 4, "q": "¿Qué modelo de replicación del ADN hace posible la conjugación?", "o": ["El del círculo rodante (sigma), unidireccional y asimétrico.", "El modelo theta, bidireccional, típico del cromosoma en general.", "El modelo conservativo, que copia toda la molécula.", "La replicación por mitosis, como en las eucariotas."], "a": 0, "ok": "Se corta una hebra, que pasa a la célula receptora a través del pilus; cada célula sintetiza la complementaria.", "ko": {"1": "Es bidireccional y se da en el cromosoma.", "2": "No es el descrito.", "3": "No existe en procariotas."}, "n": ""}, {"id": 42, "t": "Tema 4 · Citoplasma, nucleoide y flagelos", "b": 4, "q": "En la quimiotaxia, si una bacteria quiere desplazarse hacia un atrayente, ¿en qué sentido gira más tiempo sus flagelos?", "o": ["En el sentido de las agujas del reloj, que da volteretas.", "En sentido contrario a las agujas del reloj, con carreras largas.", "No gira los flagelos, se desliza por el medio.", "Alterna cada segundo el sentido, sin cambiar la dirección."], "a": 1, "ok": "En el mismo sentido que las agujas del reloj hay volteretas (tumbos). Con atrayente creciente hay menos tumbos y carreras más largas.", "ko": {"0": "Ese giro produce volteretas.", "2": "Los necesita para la carrera.", "3": "Eso es movimiento al azar."}, "n": ""}, {"id": 43, "t": "Tema 4 · Citoplasma, nucleoide y flagelos", "b": 4, "q": "¿Por dónde crece el filamento flagelar?", "o": ["Por su base, junto al cuerpo basal del flagelo.", "Por su zona central, que se alarga como un acordeón de forma habitual.", "Por su ápice, donde se ensamblan las subunidades de flagelina.", "No crece: se forma completo en un solo paso."], "a": 2, "ok": "Las proteínas atraviesan las envolturas y se autoensamblan fuera. Primero se forman las estructuras de anclaje, luego el gancho y por último las flagelinas.", "ko": {"0": "La base se forma antes y no es donde se añaden las subunidades.", "1": "No crece por el medio.", "3": "Se ensambla poco a poco."}, "n": "Los apuntes solo dicen que se autoensamblan y que las flagelinas son lo último; el crecimiento por el ápice es el dato clásico."}, {"id": 44, "t": "Tema 5 · Endosporas y células diferenciadas", "b": 5, "q": "Cita una célula diferenciada que NO tenga estado de hipometabolia:", "o": ["La endospora de Bacillus, que está en hipometabolia.", "El quiste de Azotobacter, que es una forma de reposo.", "El acineto de las cianobacterias, también de reposo.", "El heteroquiste de las cianobacterias, que fija N2."], "a": 3, "ok": "Es una célula especializada en fijar N2: no es forma de reposo ni de resistencia. Quistes, mixosporas y acinetos sí son formas de reposo.", "ko": {"0": "Tiene hipometabolia.", "1": "Es forma de reposo.", "2": "Es forma de reposo con baja actividad."}, "n": ""}, {"id": 45, "t": "Tema 5 · Endosporas y células diferenciadas", "b": 5, "q": "¿Por qué la producción de endosporas no es una forma de reproducción?", "o": ["Cada célula forma una sola endospora: no aumenta el número.", "Se forman dos endosporas por cada célula que esporula.", "Solo las células eucariotas forman endosporas bacterianas.", "Las endosporas las genera un virus dentro de la bacteria."], "a": 0, "ok": "La función es resistencia y supervivencia, no multiplicación.", "ko": {"1": "Se forma una sola.", "2": "Son de bacterias.", "3": "No intervienen virus."}, "n": ""}, {"id": 46, "t": "Tema 5 · Endosporas y células diferenciadas", "b": 5, "q": "¿Por qué las endosporas no son estructuras celulares?", "o": ["Tienen un núcleo con membrana rodeando su ADN.", "Su protoplasto está deshidratado, con pocos enzimas y ribosomas.", "Están muy hidratadas y metabólicamente muy activas de forma habitual.", "No contienen ADN en su interior, solo proteínas."], "a": 1, "ok": "Se ven dentro de la célula días antes de la germinación, pero no son una célula completa.", "ko": {"0": "No tienen núcleo.", "2": "Están deshidratadas.", "3": "Su protoplasto contiene ADN unido a SASP."}, "n": ""}, {"id": 47, "t": "Tema 5 · Endosporas y células diferenciadas", "b": 5, "q": "¿Qué ventaja tiene en el medio una bacteria que produce endosporas?", "o": ["Crece más rápido que las bacterias que no esporulan.", "Se reproduce más veces, formando varias células hijas.", "Sobrevive a calor, desecación y radiación, y se dispersa.", "No necesita nunca nutrientes, incluso en estado vegetativo."], "a": 2, "ok": "Pueden permanecer durmientes hasta 50-100 años y colonizar otros hábitats.", "ko": {"0": "Las endosporas no crecen.", "1": "No es reproducción.", "3": "Pasa a forma vegetativa al germinar."}, "n": ""}, {"id": 48, "t": "Tema 5 · Endosporas y células diferenciadas", "b": 5, "q": "¿Qué ventaja tiene la tindalización sobre el autoclave y por qué no se usa siempre?", "o": ["Es más rápida que el autoclave y mata todo de golpe.", "Destruye todas las endosporas con un solo calentamiento.", "Se realiza siempre a 121 °C, como el autoclave.", "Usa temperaturas menores y sirve con azúcares que caramelizan."], "a": 3, "ok": "Al germinar las endosporas en la incubación, las nuevas células vegetativas mueren en el siguiente calentamiento.", "ko": {"0": "Es fraccionada y tarda más.", "1": "Requiere repetirse.", "2": "Esa es la temperatura del autoclave."}, "n": "La razón de no usarla siempre (lentitud) es una deducción; los apuntes solo explican el método y su ventaja con los azúcares."}, {"id": 49, "t": "Tema 5 · Endosporas y células diferenciadas", "b": 5, "q": "¿Por qué la endospora no se decolora al lavar con agua en la tinción de Schaeffer-Fulton?", "o": ["La malaquita, con calor, penetra y se retiene por su basicidad.", "Ya está teñida de safranina antes del lavado con agua.", "El agua solo arrastra el color de las esporas.", "La endospora es Gram negativa y no pierde el colorante en general."], "a": 0, "ok": "En cambio, la célula vegetativa pierde el verde con agua y luego se tiñe de safranina.", "ko": {"1": "La safranina es el contraste final.", "2": "Lava la célula vegetativa.", "3": "No es el principio de esta tinción."}, "n": ""}, {"id": 50, "t": "Tema 5 · Endosporas y células diferenciadas", "b": 5, "q": "¿Por qué los ciclos vegetativo y de esporulación son procesos excluyentes?", "o": ["La esporulación ocurre en fase exponencial con abundantes nutrientes.", "Si hay endospora no hay estado vegetativo, y al revés.", "Ambos procesos ocurren a la vez en la misma célula.", "La bacteria muere siempre al comenzar a esporular."], "a": 1, "ok": "Se produce uno u otro. La esporulación se activa con alta densidad y déficit nutricional.", "ko": {"0": "Ocurre en fase estacionaria con déficit.", "2": "Son incompatibles.", "3": "La célula forma una endospora."}, "n": ""}, {"id": 51, "t": "Tema 6 · Nutrición y tipos nutricionales", "b": 6, "q": "¿Qué diferencia nutricional clara hay entre los microorganismos de hábitats acuáticos dulces y salinos?", "o": ["Los marinos no necesitan sales, a diferencia de los de agua dulce.", "Los de agua dulce requieren más Na+ que los marinos.", "Los marinos y halófilos requieren altas concentraciones de Na+.", "No hay ninguna diferencia nutricional entre ellos."], "a": 2, "ok": "Los requerimientos reflejan la composición celular y el hábitat natural. Los de agua dulce no necesitan esa sal.", "ko": {"0": "Requieren Na+.", "1": "Es al revés.", "3": "Se refleja el hábitat."}, "n": ""}, {"id": 52, "t": "Tema 6 · Nutrición y tipos nutricionales", "b": 6, "q": "¿Qué ventaja nutricional tienen los microorganismos que producen hemolisinas?", "o": ["Obtienen luz como fuente de energía de los hematíes.", "Obtienen carbono inorgánico para fijarlo en su biosíntesis.", "Producen oxígeno que usan en su metabolismo respiratorio.", "Rompen glóbulos rojos y obtienen hierro."], "a": 3, "ok": "Las bacterias patógenas compiten por el hierro; Staphylococcus aureus libera los componentes de los hematíes, lo que explica el satelitismo de Haemophilus influenzae.", "ko": {"0": "No es una fuente de luz.", "1": "Obtienen nutrientes orgánicos.", "2": "No es el caso."}, "n": ""}, {"id": 53, "t": "Tema 6 · Nutrición y tipos nutricionales", "b": 6, "q": "Cuando un microorganismo es quimioheterótrofo, asumimos que su donador de electrones es orgánico porque:", "o": ["Su fuente orgánica de carbono es también su donador de electrones.", "Utiliza luz como fuente de energía para su metabolismo de forma habitual.", "Fija CO2 atmosférico como única fuente de carbono.", "Oxida amoníaco para obtener energía y poder reductor."], "a": 0, "ok": "Quimioorganoheterótrofo: energía química, donador orgánico y carbono orgánico, y la fuente de carbono es también el donador.", "ko": {"1": "Eso sería fototrofo.", "2": "Eso es autótrofo.", "3": "Eso lo hacen los quimiolitotrofos."}, "n": ""}, {"id": 54, "t": "Tema 6 · Nutrición y tipos nutricionales", "b": 6, "q": "¿Qué donador de electrones utiliza un quimioautótrofo?", "o": ["Glucosa, que oxida por glucólisis hasta piruvato.", "Un compuesto inorgánico, como H2, NH3, NO2-, H2S o Fe2+.", "Agua, como en la fotosíntesis oxigénica con luz.", "Aminoácidos, que degrada para obtener energía."], "a": 1, "ok": "Son quimiolitoautótrofos: energía química, donador inorgánico y CO2 como fuente de carbono.", "ko": {"0": "Es un donador orgánico.", "2": "Es la fotosíntesis oxigénica.", "3": "Son donadores orgánicos."}, "n": ""}, {"id": 55, "t": "Tema 6 · Nutrición y tipos nutricionales", "b": 6, "q": "¿Qué fuente de carbono utiliza un quimiolitotrofo?", "o": ["Carbohidratos, como la glucosa y otros azúcares simples.", "Ácidos grasos, que oxida para obtener energía.", "CO2, carbono inorgánico, porque es un autótrofo.", "Aminoácidos del medio, que incorpora a sus proteínas."], "a": 2, "ok": "La fuente de carbono no es el donador de electrones; el donador es inorgánico (H2, NH3…) y el carbono viene del CO2.", "ko": {"0": "Es carbono orgánico.", "1": "Son orgánicos.", "3": "Son orgánicos."}, "n": "Si tu profesor llama «quimiolitotrofo» solo al que usa donador inorgánico, el carbono podría ser orgánico (mixotrofo); según los apuntes, es autótrofo."}, {"id": 56, "t": "Tema 7 · Metabolismo quimioheterótrofo", "b": 7, "q": "¿Pueden las bacterias usar nitrato para obtener energía (ATP)?", "o": ["No, el nitrato solo sirve como fuente de nitrógeno.", "Solo si hay oxígeno presente en el medio.", "Solo mediante fermentación, sin cadena de transporte.", "Sí: en respiración anaerobia."], "a": 3, "ok": "En ausencia de oxígeno, la cadena de transporte cede los electrones al nitrato (NO3- → NO2-), y se obtiene ATP por fosforilación oxidativa.", "ko": {"0": "Eso es la reducción asimiladora, que no produce ATP.", "1": "El nitrato sustituye al oxígeno.", "2": "La fermentación no usa aceptores exógenos."}, "n": ""}, {"id": 57, "t": "Tema 8 · Metabolismo quimioautótrofo", "b": 8, "q": "El proceso de fijación de nitrógeno en bacterias implica:", "o": ["La reducción de N2 a amonio por la nitrogenasa.", "La oxidación de NO2- a NO3- por bacterias nítricas.", "La reducción de NO2- a amonio para asimilarlo.", "La oxidación de NH3 a NO2- por bacterias nitrosas."], "a": 0, "ok": "Bacterias como Azotobacter o Rhizobium fusionan dos moléculas de N2 y forman amonio.", "ko": {"1": "Es parte de la nitrificación.", "2": "Es una reducción de nitrito, no la fijación de N2.", "3": "Es la nitrificación."}, "n": ""}, {"id": 58, "t": "Tema 6 · Nutrición y tipos nutricionales", "b": 6, "q": "¿Qué grupo nutricional podría obtener todos sus componentes celulares a partir de glucosa y sales minerales?", "o": ["Los fotoautótrofos, que necesitan luz y CO2 como fuente en general.", "Los quimioheterótrofos, que usan glucosa para C y energía.", "Los quimioautótrofos, que oxidan compuestos inorgánicos.", "Los fotoheterótrofos, que necesitan luz como energía."], "a": 1, "ok": "La glucosa aporta carbono, energía y electrones; las sales minerales aportan N, P y S.", "ko": {"0": "Necesitan luz y CO2.", "2": "Necesitan un donador inorgánico y fijan CO2.", "3": "Necesitan luz como fuente de energía."}, "n": ""}, {"id": 59, "t": "Tema 6 · Nutrición y tipos nutricionales", "b": 6, "q": "Un organismo que usa energía luminosa, H2S como donador de electrones y CO2 como fuente de carbono es:", "o": ["Fotoorganoheterótrofo, que usa donador y carbono orgánicos.", "Quimiolitoautótrofo, que usa energía química inorgánica.", "Fotolitoautótrofo, por la luz, el H2S y el CO2.", "Quimioorganoheterótrofo, que oxida compuestos orgánicos."], "a": 2, "ok": "Luz = fototrofo; donador inorgánico (H2S) = litotrofo; CO2 = autótrofo.", "ko": {"0": "Usa donador y carbono orgánicos.", "1": "Usa energía química, no luz.", "3": "Usa energía química y compuestos orgánicos."}, "n": ""}, {"id": 60, "t": "Tema 6 · Nutrición y tipos nutricionales", "b": 6, "q": "Los microorganismos que usan compuestos inorgánicos como fuente de carbono, energía y electrones se denominan:", "o": ["Fotolitoautótrofos, que obtienen la energía de la luz.", "Quimioorganoheterótrofos, que usan compuestos orgánicos.", "Fotoorganoheterótrofos, que usan luz y carbono orgánico.", "Quimiolitoautótrofos, con energía química y CO2."], "a": 3, "ok": "Usan energía química, donador inorgánico y CO2 como fuente de carbono.", "ko": {"0": "Obtienen la energía de la luz.", "1": "Usan compuestos orgánicos.", "2": "Usan luz y compuestos orgánicos."}, "n": ""}, {"id": 61, "t": "Tema 7 · Metabolismo quimioheterótrofo", "b": 7, "q": "¿Qué suministra el catabolismo a la célula?", "o": ["Energía, poder reductor y metabolitos precursores.", "Solo componentes celulares nuevos, como en el anabolismo.", "Solo agua, que se obtiene en las reacciones redox.", "Nada: solo consume energía de la célula para funcionar."], "a": 0, "ok": "El catabolismo son las reacciones desasimilatorias, por ejemplo glucosa → CO2 + ATP + NADH. El anabolismo es la biosíntesis.", "ko": {"1": "Eso lo hace el anabolismo.", "2": "El agua se obtiene en las reacciones redox, pero no es lo único.", "3": "Libera energía."}, "n": ""}, {"id": 62, "t": "Tema 7 · Metabolismo quimioheterótrofo", "b": 7, "q": "¿Qué se libera en la oxidación de las moléculas?", "o": ["Solo energía en forma de calor, sin electrones.", "Electrones, protones y energía aprovechable por la célula.", "Solo CO2 como producto final de la reacción.", "Nitrógeno gaseoso procedente de los aminoácidos de forma habitual."], "a": 1, "ok": "En una reacción redox, el agente oxidado cede electrones.", "ko": {"0": "También se liberan electrones y protones.", "2": "Es un producto, pero no lo único.", "3": "No se libera nitrógeno."}, "n": ""}, {"id": 63, "t": "Tema 7 · Metabolismo quimioheterótrofo", "b": 7, "q": "¿Qué tipos de trabajo realiza la célula con la energía del catabolismo?", "o": ["Solo trabajo químico, para sintetizar macromoléculas.", "Solo trabajo de transporte de nutrientes por la membrana.", "Químico (biosíntesis), de transporte y mecánico (movimiento).", "Ninguno: la energía se pierde siempre como calor."], "a": 2, "ok": "Es la clasificación clásica del uso de la energía en la célula.", "ko": {"0": "Hay también transporte y movimiento.", "1": "Falta biosíntesis y movimiento.", "3": "Se usa para el trabajo celular."}, "n": "El enunciado del PDF dice «todas las bacterias realizan…» y es dudoso porque no todas se mueven; aquí se plantea como tipos de trabajo."}, {"id": 64, "t": "Tema 7 · Metabolismo quimioheterótrofo", "b": 7, "q": "En una reacción redox, el agente reductor es el que:", "o": ["Capta los electrones y se reduce en la reacción.", "Cede solo protones, sin transferir ningún electrón.", "Produce oxígeno como producto de la reacción redox.", "Cede los electrones y se oxida en la reacción."], "a": 3, "ok": "El agente reductor se oxida y el oxidante capta los electrones.", "ko": {"0": "Eso es el agente oxidante.", "1": "El criterio es la cesión de electrones.", "2": "No define al reductor."}, "n": ""}, {"id": 65, "t": "Tema 7 · Metabolismo quimioheterótrofo", "b": 7, "q": "¿Qué papel tiene el oxígeno en la respiración aerobia?", "o": ["Es el aceptor terminal de electrones (agente oxidante).", "Es el mejor agente reductor de toda la cadena.", "Es el donador de electrones de la respiración.", "Solo se usa en las fermentaciones, no en la respiración."], "a": 0, "ok": "Capta los electrones y los protones y pasa a H2O. No es un reductor.", "ko": {"1": "Es el mejor aceptor, no el mejor reductor.", "2": "El donador es el compuesto orgánico.", "3": "En fermentación no interviene."}, "n": ""}, {"id": 66, "t": "Tema 7 · Metabolismo quimioheterótrofo", "b": 7, "q": "¿Qué proceso rinde más ATP?", "o": ["La fosforilación a nivel de sustrato de la glucólisis.", "La fosforilación oxidativa, con cadena de transporte y ATPasa.", "Ambas rinden exactamente la misma cantidad de ATP.", "Ninguna de las dos produce ATP en la célula."], "a": 1, "ok": "La fosforilación a nivel de sustrato produce menos ATP.", "ko": {"0": "Rinde menos.", "2": "La oxidativa rinde más.", "3": "Ambas lo producen."}, "n": ""}, {"id": 67, "t": "Tema 7 · Metabolismo quimioheterótrofo", "b": 7, "q": "La fosforilación oxidativa y la fotofosforilación tienen en común que:", "o": ["Ambas usan NADH como único donador de electrones en todas las especies.", "Solo ocurren en ausencia de membrana celular.", "Ambas necesitan transferir electrones y usan la fuerza protón motriz.", "Se dan en el citoplasma sin cadena de transporte."], "a": 2, "ok": "Los protones entran por la ATPasa y se sintetiza ATP.", "ko": {"0": "En la fotofosforilación el origen es la luz.", "1": "Ocurren en la membrana.", "3": "Necesitan una cadena de transporte."}, "n": ""}, {"id": 68, "t": "Tema 7 · Metabolismo quimioheterótrofo", "b": 7, "q": "Las fermentaciones se caracterizan por ser:", "o": ["Oxidación total de la glucosa hasta CO2 con O2.", "Proceso que usa nitrato como aceptor terminal.", "Proceso en la membrana, con cadena de transporte y ATPasa en general.", "Oxidación parcial con ATP por fosforilación a nivel de sustrato."], "a": 3, "ok": "No intervienen la cadena de transporte ni el oxígeno.", "ko": {"0": "Eso es la respiración.", "1": "Eso es respiración anaerobia.", "2": "Ocurren en el citoplasma."}, "n": ""}, {"id": 69, "t": "Tema 7 · Metabolismo quimioheterótrofo", "b": 7, "q": "La respiración anaerobia funciona:", "o": ["Sin oxígeno, o con niveles muy bajos, con otro aceptor.", "Solo en presencia de oxígeno como aceptor terminal.", "Solo con luz, usando pigmentos fotosintéticos.", "Sin ningún aceptor de electrones del medio."], "a": 0, "ok": "Aceptores como nitratos, nitritos o sulfatos, con menos energía que la respiración aerobia.", "ko": {"1": "Es el aceptor de la aerobia.", "2": "No necesita luz.", "3": "Sí necesita un aceptor exógeno."}, "n": "El PDF dice «siempre en ausencia de oxígeno»; en los apuntes se matiza «o niveles muy bajos»."}, {"id": 70, "t": "Tema 7 · Metabolismo quimioheterótrofo", "b": 7, "q": "Comparando respiraciones anaerobias, la que se hace con nitrato como aceptor da:", "o": ["Menos energía que la realizada sobre fumarato.", "Más energía que la realizada sobre fumarato.", "Exactamente la misma energía que con fumarato.", "Ninguna energía, porque no produce ATP."], "a": 1, "ok": "Cuanto mayor es la diferencia de potencial entre donador y aceptor, mayor es la energía liberada.", "ko": {"0": "Es mayor.", "2": "Depende del aceptor.", "3": "Produce ATP."}, "n": "Los apuntes dan el principio (diferencia de potencial); la comparación nitrato-fumarato es la aplicación esperada."}, {"id": 71, "t": "Tema 7 · Metabolismo quimioheterótrofo", "b": 7, "q": "La fosforilación a nivel de sustrato tiene lugar en:", "o": ["Solo en la fotosíntesis de las cianobacterias en general.", "Solo en la fermentación, no en la respiración.", "Tanto en la respiración como en la fermentación.", "No se da en ninguno de estos procesos."], "a": 2, "ok": "En ambas se forma ATP en pasos concretos de las rutas de oxidación.", "ko": {"0": "Allí es fotofosforilación.", "1": "También en la respiración.", "3": "Es habitual en ambas."}, "n": ""}, {"id": 72, "t": "Tema 7 · Metabolismo quimioheterótrofo", "b": 7, "q": "La energía obtenida en la respiración aerobia, comparada con la de la fermentación, es:", "o": ["Menor, porque la fermentación aprovecha mejor la glucosa.", "Igual, porque ambas oxidan la misma molécula.", "No se pueden comparar al ser procesos distintos.", "Mayor, porque oxida totalmente el donador."], "a": 3, "ok": "La respiración oxida totalmente el donador y usa la cadena de transporte.", "ko": {"0": "La fermentación rinde menos.", "1": "Hay una gran diferencia.", "2": "Sí se compara."}, "n": ""}, {"id": 73, "t": "Tema 7 · Metabolismo quimioheterótrofo", "b": 7, "q": "Un anaerobio facultativo sin oxígeno realiza antes una respiración anaerobia que una fermentación porque:", "o": ["La respiración anaerobia le rinde más ATP.", "La fermentación genera más sustratos reducidos.", "La fermentación es imposible sin oxígeno.", "La respiración anaerobia no necesita aceptor."], "a": 0, "ok": "La fermentación solo produce ATP por fosforilación a nivel de sustrato.", "ko": {"1": "No es el motivo.", "2": "Es posible pero rinde menos.", "3": "Sí necesita un aceptor exógeno."}, "n": ""}, {"id": 74, "t": "Tema 6 · Nutrición y tipos nutricionales", "b": 6, "q": "Los quimioorganoheterótrofos son los microorganismos que:", "o": ["Usan moléculas inorgánicas como fuente de energía.", "Usan moléculas orgánicas como energía.", "Usan la luz como fuente de energía principal.", "Fijan CO2 como única fuente de carbono."], "a": 1, "ok": "Los que usan moléculas inorgánicas como fuente de energía son litotrofos.", "ko": {"0": "Eso es litotrofo.", "2": "Eso es fototrofo.", "3": "Eso es autótrofo."}, "n": ""}, {"id": 75, "t": "Tema 7 · Metabolismo quimioheterótrofo", "b": 7, "q": "La ruta de las pentosas fosfato es:", "o": ["Vía principal de obtención de ATP para la célula.", "Vía que da más ATP que la ruta EMP.", "Vía de obtención de precursores para quimioheterótrofos.", "Vía exclusiva de los quimioautótrofos del suelo."], "a": 2, "ok": "No es una vía de ATP: en EMP se obtiene más ATP. Es la ruta que usan los fermentadores heterolácticos.", "ko": {"0": "No es su función principal.", "1": "La EMP rinde más.", "3": "La usan los quimioheterótrofos."}, "n": ""}, {"id": 76, "t": "Tema 7 · Metabolismo quimioheterótrofo", "b": 7, "q": "Las principales ventajas de las fermentaciones podrían ser:", "o": ["Obtener más ATP que con respiración sin oxígeno.", "Solo la utilidad industrial de sus productos finales en general.", "No tienen ninguna ventaja para la bacteria.", "Utilidad industrial de los productos y reoxidar NADH sin O2."], "a": 3, "ok": "No dan más ATP que la respiración.", "ko": {"0": "Rinden poco ATP.", "1": "También reoxidan NADH.", "2": "Tienen ventajas claras."}, "n": ""}, {"id": 77, "t": "Tema 8 · Metabolismo quimioautótrofo", "b": 8, "q": "¿Cuál de estos compuestos NO sirve como sustrato de oxidaciones para obtener energía en quimiolitoautótrofos?", "o": ["Fe3+, la forma más oxidada del hierro.", "NO2-, que las nítricas oxidan a nitrato.", "NH3, que se oxida a nitrito por nitrosas.", "H2S, que se oxida a azufre o sulfato."], "a": 0, "ok": "Es la forma más oxidada del hierro, no puede ceder más electrones. NO2-, NH3, Fe2+ y H2S son donadores.", "ko": {"1": "Se oxida a NO3- (Nitrobacter).", "2": "Se oxida a nitrito.", "3": "Se oxida a S0 o sulfato."}, "n": ""}, {"id": 78, "t": "Tema 8 · Metabolismo quimioautótrofo", "b": 8, "q": "¿Qué diferencia hay entre bacterias nitrificantes y desnitrificantes?", "o": ["Las nitrificantes fijan N2 y las desnitrificantes lo liberan a la atmósfera.", "Las nitrificantes oxidan amonio a nitrato; las desnitrificantes reducen nitrato a N2.", "Las desnitrificantes oxidan amonio y las nitrificantes lo reducen a N2.", "No hay diferencia: son dos nombres para el mismo metabolismo."], "a": 1, "ok": "Las nitrosas forman nitrito y las nítricas forman nitrato. Las desnitrificantes devuelven N2 a la atmósfera.", "ko": {"0": "Esa es la fijación.", "2": "Es lo que hacen las nitrificantes.", "3": "Tienen metabolismos opuestos."}, "n": ""}, {"id": 79, "t": "Tema 8 · Metabolismo quimioautótrofo", "b": 8, "q": "El transporte inverso de electrones:", "o": ["Solo lo realizan los anaerobios estrictos de fondo.", "Solo lo realizan los litotrofos y ningún otro grupo.", "Genera poder reductor (NADH) y consume energía.", "No existe en las bacterias fotosintéticas ni quimiolitotrofas."], "a": 2, "ok": "Salvo el H2, los donadores inorgánicos no pueden reducir directamente al NAD+.", "ko": {"0": "Nitrobacter, por ejemplo, es aerobia.", "1": "También lo usan las bacterias rojas fotosintéticas.", "3": "Existe."}, "n": "El enunciado del PDF tiene las opciones renumeradas; aquí se reformula."}, {"id": 80, "t": "Tema 9 · Metabolismo fototrofo", "b": 9, "q": "Un fotosistema es:", "o": ["Solo proteínas que bombean protones a través de la membrana en general.", "Solo muchas clorofilas y carotenos agrupados en la membrana.", "Solo transportadores de electrones sin pigmentos captadores.", "Pigmentos (antena y centro de reacción) con transportadores."], "a": 3, "ok": "Los pigmentos antena canalizan la energía hasta el centro de reacción; luego los electrones van a la cadena de transporte.", "ko": {"0": "Falta captar la luz.", "1": "Incluye transportadores.", "2": "Falta la parte de captación."}, "n": ""}, {"id": 81, "t": "Tema 9 · Metabolismo fototrofo", "b": 9, "q": "Una diferencia entre fotosíntesis oxigénica y anoxigénica es que en la oxigénica:", "o": ["El donador de electrones es el agua y se libera O2.", "El donador de electrones es el H2S y se forma azufre.", "No se fija CO2, solo se obtiene ATP.", "Siempre se usa un único fotosistema por la vía cíclica."], "a": 0, "ok": "En la anoxigénica el donador es otro compuesto (H2S, S0, S2O3 2-) y no hay oxígeno; a veces se acumulan gránulos de S0.", "ko": {"1": "Es el de la anoxigénica.", "2": "Ambas pueden fijar CO2.", "3": "Usa P700 y P680 en la vía acíclica."}, "n": "El enunciado del PDF habla de «producir agua» y es discutible; aquí se plantea con el donador, que es el criterio de los apuntes."}]</script>
<script id="vars" type="application/json">[{"id": 1000, "b": 18, "g": 2, "t": "Tema 2 · Clasificación y organización celular", "ch": "De «¿qué es?» a «¿qué NO es?»", "q": "Una endospora NO es:", "o": ["Una forma de resistencia frente a condiciones adversas.", "Una forma de reproducción que multiplica las bacterias.", "Una estructura que protege frente al calor y la desecación.", "Una forma de supervivencia en ambientes sin nutrientes."], "a": 1, "ok": "Es una célula diferenciada de reposo y resistencia; cada célula forma una sola.", "ko": {"0": "Sí lo es.", "2": "Sí lo hace.", "3": "Sí lo es."}, "n": ""}, {"id": 1001, "b": 17, "g": 2, "t": "Tema 2 · Clasificación y organización celular", "ch": "De «sí es» a «NO es»", "q": "Un plásmido NO es:", "o": ["ADN circular extracromosómico de pequeño tamaño.", "Autorreplicable de forma independiente del cromosoma.", "Imprescindible para la viabilidad de la célula.", "Portador posible de genes de resistencia o virulencia."], "a": 2, "ok": "Los plásmidos aportan ventajas (resistencias, virulencia) pero la célula vive sin ellos.", "ko": {"0": "Sí lo es.", "1": "Sí lo es.", "3": "Sí puede serlo."}, "n": ""}, {"id": 1002, "b": 22, "g": 3, "t": "Tema 3 · Pared, membrana y transporte", "ch": "Se pregunta por el contrario", "q": "¿Qué forma es la propia de las bacterias que se disponen en tres planos de división?", "o": ["Estreptococo, que forma cadenas.", "Tétrada, que forma grupos de cuatro.", "Diplobacilo, que forma pares de bacilos.", "Estafilococo, que forma racimos."], "a": 3, "ok": "La división en tres planos da estafilococos; en un plano, diplococos y estreptococos; en dos planos perpendiculares, tétradas y sarcinas.", "ko": {"0": "Se divide en un solo plano.", "1": "Dos planos perpendiculares.", "2": "Es una asociación de bacilos."}, "n": ""}, {"id": 1003, "b": 25, "g": 3, "t": "Tema 3 · Pared, membrana y transporte", "ch": "De «Gram negativa» a «Gram positiva»", "q": "¿Qué característica es propia de la pared de las bacterias Gram positivas?", "o": ["Capa gruesa de peptidoglicano con ácidos teicoicos.", "Membrana externa con LPS y lípido A.", "Espacio periplásmico amplio con porinas.", "Pared de ácidos micólicos muy impermeable en general."], "a": 0, "ok": "Las Gram negativas tienen capa fina y membrana externa con LPS.", "ko": {"1": "Es de las Gram negativas.", "2": "Es de las Gram negativas.", "3": "Es de las micobacterias."}, "n": ""}, {"id": 1004, "b": 26, "g": 3, "t": "Tema 3 · Pared, membrana y transporte", "ch": "Se pregunta por un paso concreto", "q": "En la tinción de Gram, ¿qué reactivo actúa como mordiente?", "o": ["El alcohol etílico, que decolora el complejo.", "El lugol, yodo con yoduro de potasio.", "La safranina, colorante de contraste final.", "La fuchina, de la tinción ácido-alcohol resistente."], "a": 1, "ok": "Reacciona con el cristal violeta y forma un complejo de gran tamaño.", "ko": {"0": "Es el decolorante.", "2": "Es el colorante de contraste.", "3": "Es de la tinción de Ziehl-Neelsen."}, "n": ""}, {"id": 1005, "b": 26, "g": 3, "t": "Tema 3 · Pared, membrana y transporte", "ch": "Se pregunta por el resultado", "q": "Tras el decolorante, ¿cómo se ven al final las bacterias Gram negativas?", "o": ["Violetas, por retener el cristal violeta.", "Verdes, por el verde de malaquita añadido.", "Rosas, por la safranina de contraste final.", "Incoloras, al perder todo el colorante."], "a": 2, "ok": "El alcohol disuelve el complejo cristal violeta-yodo en la pared fina. Las Gram positivas se ven violetas.", "ko": {"0": "Es el color de las Gram positivas.", "1": "Es el verde de malaquita de Schaeffer-Fulton.", "3": "Se tiñen con la safranina."}, "n": ""}, {"id": 1006, "b": 28, "g": 3, "t": "Tema 3 · Pared, membrana y transporte", "ch": "De «tan buenos» a «sobre qué actúan»", "q": "Los antibióticos β-lactámicos se unen a:", "o": ["Los ribosomas 30S de la célula bacteriana.", "Los ribosomas 50S de la célula bacteriana.", "La ADN girasa que superenrolla el cromosoma.", "Las PBP, que catalizan la transpeptidación."], "a": 3, "ok": "Así impiden la unión entre tetrapéptidos del peptidoglicano.", "ko": {"0": "Es el sitio de las tetraciclinas.", "1": "Es el sitio de los macrólidos.", "2": "Es diana de otros antibióticos (quinolonas)."}, "n": "Datos de dianas: tetraciclinas 30S y macrólidos 50S vienen en el tema 4."}, {"id": 1007, "b": 27, "g": 3, "t": "Tema 3 · Pared, membrana y transporte", "ch": "Se pregunta por la enzima", "q": "¿Qué enlace hidroliza la lisozima?", "o": ["El β(1→4) entre NAG y ácido N-acetilmurámico.", "El enlace peptídico entre las dos D-alaninas.", "El puente de pentaglicina entre tetrapéptidos.", "El enlace éster de los fosfolípidos de membrana."], "a": 0, "ok": "La pared pierde rigidez y la bacteria se lisa por la presión osmótica.", "ko": {"1": "Es el sitio de la transpeptidación.", "2": "No es su diana.", "3": "No es su diana."}, "n": ""}, {"id": 1008, "b": 25, "g": 3, "t": "Tema 3 · Pared, membrana y transporte", "ch": "Se pregunta por otra estructura", "q": "¿Qué estructura de las bacterias Gram negativas contiene el lípido A (endotoxina)?", "o": ["La cápsula de polisacáridos exterior.", "El LPS de la membrana externa celular.", "La membrana citoplasmática interna.", "Los ácidos teicoicos de la pared."], "a": 1, "ok": "El lípido A es la parte fija del LPS; se libera solo con la lisis.", "ko": {"0": "Es polisacárido.", "2": "No contiene LPS.", "3": "Son de Gram positivas."}, "n": ""}, {"id": 1009, "b": 32, "g": 3, "t": "Tema 3 · Pared, membrana y transporte", "ch": "De «sin pared con esteroles» a otra pared especial", "q": "¿Qué componente forma la pared de las micobacterias y las hace impermeables a antibióticos?", "o": ["La pseudomureína de su pared celular.", "Los esteroles de su membrana externa.", "Los ácidos micólicos de su pared.", "El lípido A del lipopolisacárido."], "a": 2, "ok": "Por eso se tiñen como Gram + pero no lo son, y se identifican con Ziehl-Neelsen.", "ko": {"0": "Es de algunas arqueas.", "1": "Son de la membrana de micoplasmas.", "3": "Es de Gram negativas."}, "n": ""}, {"id": 1010, "b": 33, "g": 3, "t": "Tema 3 · Pared, membrana y transporte", "ch": "De «contra gradiente» a «en qué sistema»", "q": "¿Qué sistema de transporte de nutrientes usa una permeasa, una proteína periplásmica y una ATPasa?", "o": ["El transporte simple, con una permeasa.", "La translocación de grupo, con PTS.", "La difusión pasiva, sin gasto de energía.", "El sistema ABC, con ATPasa."], "a": 3, "ok": "La energía proviene de la hidrólisis de ATP. Transporta azúcares como arabinosa y maltosa y aminoácidos como glutamato y leucina.", "ko": {"0": "Usa una sola permeasa y la fuerza protón motriz.", "1": "Es el sistema fosfotransferasa.", "2": "No gasta energía."}, "n": ""}, {"id": 1011, "b": 34, "g": 3, "t": "Tema 3 · Pared, membrana y transporte", "ch": "De «gasto útil» a otro sistema", "q": "En la translocación de grupo (PTS), ¿de dónde procede el fosfato que se transfiere a la glucosa?", "o": ["Del fosfoenolpiruvato (PEP).", "Del ATP de la célula bacteriana.", "Del NADH producido en la glucólisis.", "De la fuerza protón motriz de la membrana."], "a": 0, "ok": "La enzima transmembranosa cede el fosfato; el nutriente entra modificado.", "ko": {"1": "Es la fuente del sistema ABC.", "2": "No es la fuente.", "3": "Es la energía del transporte simple."}, "n": ""}, {"id": 1012, "b": 36, "g": 4, "t": "Tema 4 · Citoplasma, nucleoide y flagelos", "ch": "Se pregunta por la consecuencia", "q": "En procariotas, la transcripción y la traducción acopladas implican que:", "o": ["El ARNm viaja desde el núcleo hasta el citoplasma.", "Los ribosomas traducen el ARNm mientras se transcribe.", "La traducción ocurre tras procesarse el ARNm maduro en general.", "Las proteínas se sintetizan en el retículo rugoso."], "a": 1, "ok": "No hay membrana nuclear que separe ambos procesos.", "ko": {"0": "No hay núcleo.", "2": "No hay ese procesamiento.", "3": "No hay retículo."}, "n": ""}, {"id": 1013, "b": 38, "g": 4, "t": "Tema 4 · Citoplasma, nucleoide y flagelos", "ch": "De «cómo cabe» a «qué enzima»", "q": "¿Qué enzima enrolla (superenrolla negativamente) el ADN bacteriano?", "o": ["La topoisomerasa I, que relaja el ADN.", "La ADN ligasa, que une los fragmentos.", "La topoisomerasa II o ADN girasa.", "La primasa, que sintetiza los iniciadores."], "a": 2, "ok": "La topoisomerasa I lo relaja. Algunos antibióticos inhiben la girasa y no afectan a nuestras topoisomerasas.", "ko": {"0": "Relaja el ADN.", "1": "Une los fragmentos de Okazaki.", "3": "Sintetiza los iniciadores de ARN."}, "n": ""}, {"id": 1014, "b": 41, "g": 4, "t": "Tema 4 · Citoplasma, nucleoide y flagelos", "ch": "De «círculo rodante» a «theta»", "q": "El modelo de replicación bidireccional con dos horquillas que avanzan en sentidos opuestos es:", "o": ["El modelo sigma o del círculo rodante.", "El modelo conservativo de replicación.", "La replicación en una sola horquilla.", "El modelo theta (θ), bidireccional."], "a": 3, "ok": "Comienza en oriC y termina en el punto de terminación. El del círculo rodante es unidireccional.", "ko": {"0": "Es unidireccional y se usa en la conjugación.", "1": "No es el descrito.", "2": "No es el modelo de Cairns."}, "n": ""}, {"id": 1015, "b": 42, "g": 4, "t": "Tema 4 · Citoplasma, nucleoide y flagelos", "ch": "De «contrario a agujas» a «a favor»", "q": "Cuando una bacteria peritrica gira sus flagelos en el sentido de las agujas del reloj:", "o": ["Hace volteretas (tumbos) que la reorientan.", "Avanza en línea recta y rápida (carrera) en general.", "Detiene los flagelos y queda inmóvil.", "Se enquista y deja de moverse."], "a": 0, "ok": "Alterna carreras (sentido contrario a las agujas) con volteretas, y nunca va en línea recta.", "ko": {"1": "Eso es la carrera.", "2": "Giran en el otro sentido.", "3": "No es el efecto."}, "n": ""}, {"id": 1016, "b": 42, "g": 4, "t": "Tema 4 · Citoplasma, nucleoide y flagelos", "ch": "Se pregunta por el repelente", "q": "Si una bacteria detecta concentraciones crecientes de un repelente, ¿qué ocurre con sus tumbos?", "o": ["Disminuyen los tumbos y se alargan las carreras.", "Aumentan los tumbos y se acortan las carreras.", "No cambia nada en la frecuencia de tumbos.", "Se detiene el flagelo y la bacteria queda quieta."], "a": 1, "ok": "Con atrayente creciente o repelente decreciente hay menos tumbos y carreras más largas.", "ko": {"0": "Eso ocurre con un atrayente creciente.", "2": "Se modifica la frecuencia de tumbos.", "3": "No es lo que se describe."}, "n": ""}, {"id": 1017, "b": 40, "g": 4, "t": "Tema 4 · Citoplasma, nucleoide y flagelos", "ch": "De «flotar» a «orientarse»", "q": "¿Qué orgánulo permite la flotabilidad de las bacterias acuáticas a la profundidad adecuada?", "o": ["Los magnetosomas, con cristales de magnetita.", "Los carboxisomas, con RubisCO en su interior.", "Las vacuolas de gas, que dan flotabilidad.", "Los clorosomas, con pigmentos antena."], "a": 2, "ok": "Son vesículas con membrana proteica rígida impermeable al agua pero permeable al gas.", "ko": {"0": "Orientan con el campo magnético.", "1": "Contienen RubisCO.", "3": "Contienen pigmentos antena."}, "n": ""}, {"id": 1018, "b": 44, "g": 5, "t": "Tema 5 · Endosporas y células diferenciadas", "ch": "Se pregunta por otra célula diferenciada", "q": "¿Qué célula diferenciada de las cianobacterias es una forma de reposo con pared más gruesa y baja actividad fotosintética?", "o": ["El heteroquiste, que fija nitrógeno.", "La mixospora, propia de las mixobacterias.", "El quiste de Azotobacter, bacteria del suelo.", "El acineto, forma de reposo."], "a": 3, "ok": "Es resistente a la desecación. El heteroquiste, en cambio, fija N2 y no es forma de reposo.", "ko": {"0": "Fija N2; no es de reposo.", "1": "Es de las mixobacterias.", "2": "Es de Azotobacter, no de cianobacterias."}, "n": ""}, {"id": 1019, "b": 50, "g": 5, "t": "Tema 5 · Endosporas y células diferenciadas", "ch": "De «excluyentes» a «condiciones que inducen»", "q": "¿Qué condicion
