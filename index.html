es favorecen que una bacteria esporule?", "o": ["Alta densidad celular y déficit nutricional.", "Crecimiento activo con nutrientes abundantes.", "Fase de latencia con pocos nutrientes.", "Presencia de antibióticos en el medio."], "a": 0, "ok": "Se activan en secuencia más de cien genes de los operones spo.", "ko": {"1": "Mantiene el estado vegetativo.", "2": "No es la condición descrita.", "3": "No es el factor descrito."}, "n": ""}, {"id": 1020, "b": 49, "g": 5, "t": "Tema 5 · Endosporas y células diferenciadas", "ch": "Se pregunta por el contraste", "q": "En la tinción de Schaeffer-Fulton, ¿cómo se ve la endospora tras el contraste con safranina?", "o": ["Rosa, igual que la célula vegetativa.", "Verde, mientras la célula vegetativa queda rosa.", "Violeta, por el cristal violeta del Gram.", "Incolora, al lavarse con agua."], "a": 1, "ok": "El verde de malaquita con calor penetra en la endospora y no se pierde con agua.", "ko": {"0": "No se decolora.", "2": "Es el color del cristal violeta.", "3": "Se queda verde."}, "n": ""}, {"id": 1021, "b": 52, "g": 6, "t": "Tema 6 · Nutrición y tipos nutricionales", "ch": "Se pregunta por el ejemplo", "q": "En un cultivo mixto, ¿qué fenómeno explica que Haemophilus influenzae crezca alrededor de Staphylococcus aureus?", "o": ["La quimiotaxia hacia nutrientes del medio de forma habitual.", "La conjugación de plásmidos entre ambas.", "El satelitismo: S. aureus libera hemo por hemólisis.", "La fijación de nitrógeno atmosférico."], "a": 2, "ok": "Haemophilus requiere el grupo hemo de la hemoglobina.", "ko": {"0": "Es movimiento orientado.", "1": "Es transferencia de plásmidos.", "3": "No tiene relación."}, "n": ""}, {"id": 1022, "b": 54, "g": 6, "t": "Tema 6 · Nutrición y tipos nutricionales", "ch": "De «inorgánico» a «orgánico»", "q": "¿Qué donador de electrones usa un quimioorganoheterótrofo?", "o": ["H2S, un compuesto inorgánico de azufre.", "Fe2+, un ion inorgánico del hierro.", "H2, hidrógeno molecular inorgánico.", "Un compuesto orgánico."], "a": 3, "ok": "Ejemplos: protozoos y hongos.", "ko": {"0": "Es inorgánico.", "1": "Es inorgánico.", "2": "Es inorgánico."}, "n": ""}, {"id": 1023, "b": 66, "g": 7, "t": "Tema 7 · Metabolismo quimioheterótrofo", "ch": "De «más» a «menos»", "q": "¿Qué rinde menos ATP?", "o": ["La fosforilación a nivel de sustrato.", "La fosforilación oxidativa con ATPasa.", "La respiración aerobia completa de la glucosa.", "Ninguna: todas rinden la misma cantidad."], "a": 0, "ok": "La oxidativa rinde más porque usa la cadena de transporte y la ATPasa.", "ko": {"1": "Es la que más produce.", "2": "Es la de mayor rendimiento.", "3": "Sí hay diferencia."}, "n": ""}, {"id": 1024, "b": 68, "g": 7, "t": "Tema 7 · Metabolismo quimioheterótrofo", "ch": "De «es» a «NO es»", "q": "Una fermentación NO es:", "o": ["Un proceso redox con donador y aceptor en general.", "Una oxidación total del donador de electrones.", "Un proceso que usa NADH como donador.", "Un proceso que ocurre en el citoplasma."], "a": 1, "ok": "Es una oxidación parcial; el aceptor es endógeno y orgánico.", "ko": {"0": "Sí lo es.", "2": "Sí.", "3": "Sí."}, "n": ""}, {"id": 1025, "b": 71, "g": 7, "t": "Tema 7 · Metabolismo quimioheterótrofo", "ch": "Se pregunta por el lugar", "q": "¿Dónde se localiza la cadena de transporte de electrones de las procariotas?", "o": ["En el citoplasma, junto a los ribosomas en general.", "En la pared celular de mureína.", "En la membrana citoplasmática de la célula.", "En el nucleoide, junto al ADN."], "a": 2, "ok": "En eucariotas está en las mitocondrias.", "ko": {"0": "Allí ocurren la glucólisis y la fermentación.", "1": "No.", "3": "No."}, "n": ""}, {"id": 1026, "b": 75, "g": 7, "t": "Tema 7 · Metabolismo quimioheterótrofo", "ch": "Se pregunta por la ruta", "q": "¿Qué ruta usan los fermentadores heterolácticos para pasar de glucosa a piruvato?", "o": ["La glucólisis (EMP) completa de la glucosa.", "La ruta de Entner-Doudoroff de Pseudomonas.", "El ciclo de Calvin de fijación de CO2.", "El ciclo de las pentosas fosfato."], "a": 3, "ok": "Pseudomonas y bacterias relacionadas usan Entner-Doudoroff; la glucólisis es la más frecuente.", "ko": {"0": "Es la ruta más frecuente, pero no la de los heterolácticos.", "1": "Es la de Pseudomonas.", "2": "Fija CO2."}, "n": ""}, {"id": 1027, "b": 77, "g": 8, "t": "Tema 8 · Metabolismo quimioautótrofo", "ch": "De «NO sirve» a «sí sirve»", "q": "¿Cuál de estos compuestos SÍ sirve como donador de electrones para quimiolitoautótrofos?", "o": ["Fe2+, que se oxida a Fe3+.", "Fe3+, que ya está totalmente oxidado.", "Glucosa, que es un donador orgánico.", "Aminoácidos, que son donadores orgánicos."], "a": 0, "ok": "Puede oxidarse a Fe3+. Otros donadores: H2, NH3, NO2-, H2S, S0 y S2O3 2-.", "ko": {"1": "Ya está completamente oxidado.", "2": "Es un donador orgánico.", "3": "Son donadores orgánicos."}, "n": ""}, {"id": 1028, "b": 79, "g": 8, "t": "Tema 8 · Metabolismo quimioautótrofo", "ch": "De «objeto» a «quién»", "q": "Entre los donadores de los quimioautótrofos, ¿cuál entra al principio de la cadena y no necesita transporte inverso?", "o": ["El NH3, que necesita transporte inverso.", "El H2, más electronegativo que el NAD+.", "El NO2-, que necesita transporte inverso.", "El Fe2+, que necesita transporte inverso."], "a": 1, "ok": "Es más electronegativo que el NAD+, así que le cede los electrones directamente.", "ko": {"0": "Necesita transporte inverso.", "2": "Necesita transporte inverso.", "3": "Necesita transporte inverso."}, "n": "Dato del tema 8."}, {"id": 1029, "b": 81, "g": 9, "t": "Tema 9 · Metabolismo fototrofo", "ch": "De «oxigénica» a «anoxigénica»", "q": "Una característica de la fotosíntesis anoxigénica es:", "o": ["Fotólisis del agua con liberación de protones.", "Dos fotosistemas, P700 y P680, en serie.", "Un solo fotosistema, vía cíclica y donador exógeno.", "Desprendimiento de oxígeno como producto."], "a": 2, "ok": "No se genera oxígeno. Se da en bacterias verdes y rojas.", "ko": {"0": "Es de la oxigénica.", "1": "Es de la oxigénica acíclica.", "3": "No hay."}, "n": ""}, {"id": 1030, "b": null, "g": 1, "t": "Tema 1 · Historia de la Microbiología", "ch": "Pregunta nueva del temario", "q": "¿Quién descubrió los microorganismos en 1673-1674?", "o": ["Robert Koch, de la escuela de Berlín.", "Louis Pasteur, del Instituto de París.", "Robert Hooke, inventor del microscopio compuesto.", "Antonie van Leeuwenhoek, comerciante de lentes."], "a": 3, "ok": "Comunicó sus «animálculos» mediante cartas a la Royal Society de Londres.", "ko": {"0": "Fundó la escuela de bacteriología de Berlín.", "1": "Demostró la falsedad de la generación espontánea.", "2": "Inventó el microscopio óptico compuesto."}, "n": ""}, {"id": 1031, "b": null, "g": 1, "t": "Tema 1 · Historia de la Microbiología", "ch": "Pregunta nueva del temario", "q": "¿Quién inventó el microscopio óptico compuesto?", "o": ["Robert Hooke (1635-1703), en el siglo XVII.", "Antonie van Leeuwenhoek, el comerciante en general.", "Louis Pasteur, el de las vacunas.", "Robert Koch, el de los postulados."], "a": 0, "ok": "Leeuwenhoek usaba lentes simples pulidas a mano.", "ko": {"1": "Usó una lente simple muy buena.", "2": "No lo inventó.", "3": "No lo inventó."}, "n": ""}, {"id": 1032, "b": null, "g": 1, "t": "Tema 1 · Historia de la Microbiología", "ch": "Pregunta nueva del temario", "q": "¿Qué demostró el experimento de Francesco Redi (1665)?", "o": ["Que los microorganismos causan las fermentaciones.", "Que la carne tapada con gasa no desarrolla larvas.", "Que las bacterias son capaces de fijar nitrógeno.", "Que puede haber vida sin gérmenes previos."], "a": 1, "ok": "Fue un argumento contra la generación espontánea.", "ko": {"0": "Eso lo demostró Pasteur.", "2": "Fue Beijerinck.", "3": "Demostró lo contrario."}, "n": ""}, {"id": 1033, "b": null, "g": 1, "t": "Tema 1 · Historia de la Microbiología", "ch": "Pregunta nueva del temario", "q": "¿Quién defendió la teoría de la generación espontánea (abiogénesis) con un experimento de caldos calentados?", "o": ["Lazzaro Spallanzani, que tapó los caldos.", "Louis Pasteur, que ganó el premio de 1859.", "John Needham, a favor de la abiogénesis.", "Francesco Redi, con carne y gasa."], "a": 2, "ok": "Calentó caldos de carne o azúcar y vio aparecer «animálculos». Spallanzani los hirvió y tapó para refutarlo.", "ko": {"0": "Se oponía a la abiogénesis.", "1": "Demostró su falsedad.", "3": "Se opuso con carne y gasa."}, "n": ""}, {"id": 1034, "b": null, "g": 1, "t": "Tema 1 · Historia de la Microbiología", "ch": "Pregunta nueva del temario", "q": "¿En qué año convocó la Academia Francesa de Ciencias un premio sobre la generación espontánea, que ganó Pasteur?", "o": ["En 1673, año de Leeuwenhoek.", "En 1882, año de la tinción de Ziehl.", "En 1950, inicio del microscopio electrónico.", "En 1859, año del premio a Pasteur."], "a": 3, "ok": "Pasteur demostró su falsedad con un experimento y dijo en 1865 que la doctrina «nunca se recuperará de la mortal herida».", "ko": {"0": "Es el año de Leeuwenhoek.", "1": "Es el año de la tinción de Ziehl.", "2": "Es el inicio del microscopio electrónico."}, "n": ""}, {"id": 1035, "b": null, "g": 1, "t": "Tema 1 · Historia de la Microbiología", "ch": "Pregunta nueva del temario", "q": "¿En qué consiste la pasteurización?", "o": ["Calentar a 68 °C durante 10 minutos y enfriar rápido.", "Calentar a 121 °C durante 15 minutos en autoclave.", "Tres calentamientos separados por incubaciones.", "Irradiar el producto con luz ultravioleta."], "a": 0, "ok": "Se desarrolló para conservar vino y cerveza.", "ko": {"1": "Es el autoclave.", "2": "Es la tindalización.", "3": "No es la pasteurización."}, "n": ""}, {"id": 1036, "b": null, "g": 1, "t": "Tema 1 · Historia de la Microbiología", "ch": "Pregunta nueva del temario", "q": "¿Cuál de estas vacunas creó Pasteur?", "o": ["La de la viruela, con virus de la vaca.", "La de la rabia, entre otras (1885-1886).", "La de la tuberculosis, contra el bacilo de Koch.", "La de la poliomielitis, con virus inactivado."], "a": 1, "ok": "Todas se desarrollaron en menos de ocho años.", "ko": {"0": "No es una de las citadas aquí.", "2": "No es una de las citadas.", "3": "No es una de las citadas."}, "n": ""}, {"id": 1037, "b": null, "g": 1, "t": "Tema 1 · Historia de la Microbiología", "ch": "Pregunta nueva del temario", "q": "¿Cuál NO es un postulado de Koch?", "o": ["Aislarse en cultivo puro a partir del enfermo.", "Causar la enfermedad en un animal de experimentación.", "Que se encuentre en todos los individuos sanos.", "Reaislarse e identificarse a partir del animal infectado."], "a": 2, "ok": "El primero dice que debe encontrarse en todos los individuos que presentan la enfermedad.", "ko": {"0": "Sí es postulado.", "1": "Sí es postulado.", "3": "Sí es postulado."}, "n": ""}, {"id": 1038, "b": null, "g": 1, "t": "Tema 1 · Historia de la Microbiología", "ch": "Pregunta nueva del temario", "q": "¿Con qué microorganismos no es posible comprobar los postulados de Koch?", "o": ["Bacillus anthracis, el modelo del carbunco.", "Cualquier bacteria que se cultive en placa.", "Solo los hongos filamentosos y las levaduras.", "Los que solo afectan al hombre, no se cultivan, o son virus."], "a": 3, "ok": "Ejemplos: Vibrio cholerae y Helicobacter pylori, Treponema pallidum y virus (se aplican los postulados de Rivers).", "ko": {"0": "Fue el modelo de Koch.", "1": "Hay muchas con las que sí se cumplen.", "2": "No es el criterio."}, "n": ""}, {"id": 1039, "b": null, "g": 1, "t": "Tema 1 · Historia de la Microbiología", "ch": "Pregunta nueva del temario", "q": "¿Quién diseñó en 1884 la tinción de Gram?", "o": ["Hans Christian Gram.", "Robert Koch, fundador de la escuela de Berlín.", "Ziehl y Neelsen, autores de otra tinción.", "Fannie Hesse, que introdujo el agar-agar."], "a": 0, "ok": "Gram era danés.", "ko": {"1": "Fue un aporte distinto.", "2": "Diseñaron la tinción de bacilos ácido-alcohol resistentes.", "3": "Introdujo el agar."}, "n": ""}, {"id": 1040, "b": null, "g": 1, "t": "Tema 1 · Historia de la Microbiología", "ch": "Pregunta nueva del temario", "q": "¿Qué aportó Fannie Hesse a la microbiología?", "o": ["Descubrió la placa de Petri en 1887.", "Introdujo el agar-agar para solidificar los medios.", "Diseñó la tinción diferencial de Gram de forma habitual.", "Formuló los cuatro postulados de Koch."], "a": 1, "ok": "Antes de la placa de Petri se usaban rodajas de patata.", "ko": {"0": "La descubrió Richard Petri en 1887.", "2": "Fue Hans Christian Gram.", "3": "Fueron de Koch."}, "n": ""}, {"id": 1041, "b": null, "g": 1, "t": "Tema 1 · Historia de la Microbiología", "ch": "Pregunta nueva del temario", "q": "En una placa de Petri, ¿qué indica la presencia de colonias de distintos tipos?", "o": ["Que el cultivo es puro, de una sola especie.", "Que no se ha desarrollado ninguna bacteria.", "Que el cultivo no es puro, sino mixto.", "Que solo se han desarrollado virus en la placa."], "a": 2, "ok": "Cada colonia procede de una sola bacteria y las de una colonia son idénticas.", "ko": {"0": "Un cultivo puro tiene un solo tipo.", "1": "Cada colonia es un conjunto de bacterias.", "3": "Los virus no forman colonias."}, "n": ""}, {"id": 1042, "b": null, "g": 1, "t": "Tema 1 · Historia de la Microbiología", "ch": "Pregunta nueva del temario", "q": "¿Quién descubrió que algunas bacterias también realizan fotosíntesis (hacia 1930)?", "o": ["Joseph Priestley, entre 1770 y 1777.", "Jan Ingenhousz, hacia 1779.", "Sergei Winogradsky, de San Petersburgo.", "Cornelius van Niel, hacia 1930."], "a": 3, "ok": "Intervienen pigmentos distintos de la clorofila, las bacterioclorofilas.", "ko": {"0": "Descubrió la producción de oxígeno por las plantas.", "1": "Demostró el papel de la luz.", "2": "Estudió microorganismos quimioautótrofos."}, "n": ""}, {"id": 1043, "b": null, "g": 1, "t": "Tema 1 · Historia de la Microbiología", "ch": "Pregunta nueva del temario", "q": "¿Qué bacteria es responsable de alrededor del 25 % de la fotosíntesis de los medios acuáticos?", "o": ["Synechococcus, una cianobacteria ubicua.", "Rhizobium, simbionte de leguminosas.", "Azotobacter, fijadora de vida libre.", "Clostridium tetani, productora de endosporas."], "a": 0, "ok": "Además fija nitrógeno atmosférico.", "ko": {"1": "Fija N2 en simbiosis con leguminosas.", "2": "Es fijadora de vida libre.", "3": "Es un patógeno."}, "n": ""}, {"id": 1044, "b": null, "g": 1, "t": "Tema 1 · Historia de la Microbiología", "ch": "Pregunta nueva del temario", "q": "¿Qué bacteria fija nitrógeno en simbiosis con leguminosas (Beijerinck, 1888)?", "o": ["Azotobacter, de vida libre en el suelo.", "Rhizobium, simbionte de las leguminosas.", "Escherichia coli, habitante del intestino.", "Vibrio cholerae, causante del cólera."], "a": 1, "ok": "Azotobacter es fijadora de vida libre (1901).", "ko": {"0": "No necesita simbiosis.", "2": "No fija N2.", "3": "No fija N2."}, "n": ""}, {"id": 1045, "b": null, "g": 2, "t": "Tema 2 · Clasificación y organización celular", "ch": "Pregunta nueva del temario", "q": "¿Qué criterio usó Woese en 1977 para clasificar los seres vivos en dominios?", "o": ["La forma celular de cada organismo.", "La respuesta frente a la tinción de Gram en general.", "La secuencia de nucleótidos del ARNr 16S.", "El tipo de nutrición de cada organismo."], "a": 2, "ok": "Así se distinguen bacterias, arqueas y eucariotas.", "ko": {"0": "No es el criterio.", "1": "No es filogenético.", "3": "No es el criterio."}, "n": ""}, {"id": 1046, "b": null, "g": 2, "t": "Tema 2 · Clasificación y organización celular", "ch": "Pregunta nueva del temario", "q": "¿Qué característica diferencia los lípidos de la membrana de las arqueas?", "o": ["Enlaces éster, como en las bacterias.", "Esteroles en su membrana citoplasmática en general.", "Carecen de lípidos en la membrana.", "Enlaces éter, más resistentes que los éster."], "a": 3, "ok": "Son extremófilas y su membrana es más resistente.", "ko": {"0": "Es de las bacterias.", "1": "No es el rasgo diferencial.", "2": "Sí tienen."}, "n": ""}, {"id": 1047, "b": null, "g": 2, "t": "Tema 2 · Clasificación y organización celular", "ch": "Pregunta nueva del temario", "q": "¿Cuál es el aminoácido inicial en la síntesis de proteínas de las arqueas, igual que en eucariotas?", "o": ["Metionina, igual que en los eucariotas.", "Formilmetionina, como en las bacterias.", "Alanina, como primer aminoácido.", "Cisteína, como primer aminoácido."], "a": 0, "ok": "Es un rasgo molecular compartido con los eucariotas.", "ko": {"1": "Es la de bacterias.", "2": "No es el inicial.", "3": "No es el inicial."}, "n": "La formilmetionina bacteriana no aparece en los apuntes; se usa solo como distractor."}, {"id": 1048, "b": null, "g": 2, "t": "Tema 2 · Clasificación y organización celular", "ch": "Pregunta nueva del temario", "q": "¿Qué tamaño tienen los virus?", "o": ["Entre 10 y 100 µm de diámetro en general.", "Entre 0,02 y 0,3 µm de diámetro.", "Entre 1 y 5 mm de diámetro.", "Mayor que el de las bacterias."], "a": 1, "ok": "Son parásitos intracelulares estrictos, con ácido nucleico y cápsida.", "ko": {"0": "Es el rango de células eucariotas.", "2": "Es visible a simple vista.", "3": "Son más pequeños."}, "n": ""}, {"id": 1049, "b": null, "g": 2, "t": "Tema 2 · Clasificación y organización celular", "ch": "Pregunta nueva del temario", "q": "¿Qué tipo de ácido nucleico tienen los viroides?", "o": ["ADN bicatenario; infectan sobre todo animales en general.", "Proteínas únicamente; infectan a animales.", "ARN monocatenario; infectan sobre todo vegetales.", "Ribosomas completos; infectan a bacterias."], "a": 2, "ok": "Los priones son proteínas que infectan a animales.", "ko": {"0": "No es el caso.", "1": "Son los priones.", "3": "No es un ácido nucleico."}, "n": ""}, {"id": 1050, "b": null, "g": 2, "t": "Tema 2 · Clasificación y organización celular", "ch": "Pregunta nueva del temario", "q": "¿Qué tamaño y ribosomas tienen las procariotas?", "o": ["Mayores de 100 µm y con ribosomas 80S.", "Menores de 10 µm y con ribosomas 80S.", "Mayores de 10 µm y con ribosomas 70S.", "Menores de 10 µm y con ribosomas 70S."], "a": 3, "ok": "No tienen núcleo con membrana y la membrana carece de esteroles.", "ko": {"0": "Es el tamaño y ribosoma de eucariotas.", "1": "Sus ribosomas son 70S.", "2": "Son más pequeñas."}, "n": ""}, {"id": 1051, "b": null, "g": 3, "t": "Tema 3 · Pared, membrana y transporte", "ch": "Pregunta nueva del temario", "q": "¿Cuál es el tamaño estándar de una bacteria?", "o": ["Unos 0,75 µm de ancho por 2,5 µm de largo.", "Unos 10 µm de ancho por 100 µm de largo.", "Unos 2 mm de ancho por 5 mm de largo.", "Unos 0,001 µm de ancho por 0,01 de largo en general."], "a": 0, "ok": "Hay excepciones enanas como Pelagibacter (0,17 µm) y gigantes como Thiomargarita (750 µm).", "ko": {"1": "Es de una eucariota.", "2": "Es demasiado.", "3": "Es demasiado pequeño."}, "n": ""}, {"id": 1052, "b": null, "g": 3, "t": "Tema 3 · Pared, membrana y transporte", "ch": "Pregunta nueva del temario", "q": "¿Qué consecuencia biológica tiene la elevada relación superficie/volumen de las procariotas?", "o": ["Menor velocidad de crecimiento y de intercambio en general.", "Mayor velocidad de intercambio y de crecimiento.", "Mayor tamaño celular y de volumen.", "Mayor rigidez de la pared de mureína."], "a": 1, "ok": "Al tener tanta superficie, tienen más contacto con el medio.", "ko": {"0": "Es mayor.", "2": "Es consecuencia del tamaño pequeño, no lo contrario.", "3": "No es la consecuencia."}, "n": ""}, {"id": 1053, "b": null, "g": 3, "t": "Tema 3 · Pared, membrana y transporte", "ch": "Pregunta nueva del temario", "q": "¿Cómo se escribe correctamente el nombre de una bacteria cuando no se recuerda la especie?", "o": ["Bacillus spp., para una especie sin precisar.", "El Bacillus, con artículo delante del género.", "Bacillus sp., para una especie sin precisar.", "bacillus, con minúscula inicial."], "a": 2, "ok": "Si son varias especies, spp. Nunca se pone artículo delante.", "ko": {"0": "Spp. es para varias.", "1": "No se usan artículos.", "3": "El género va con mayúscula inicial."}, "n": ""}, {"id": 1054, "b": null, "g": 3, "t": "Tema 3 · Pared, membrana y transporte", "ch": "Pregunta nueva del temario", "q": "¿Cuál de estas es una función de los polímeros extracelulares (cápsula)?", "o": ["Síntesis de proteínas en el citoplasma de forma habitual.", "Obtención de energía por fosforilación.", "Replicación del ADN cromosómico.", "Resistencia a la desecación y adherencia a superficies."], "a": 3, "ok": "También: resistencia a fagos, antígeno K y factor de virulencia.", "ko": {"0": "Es del ribosoma.", "1": "No lo son.", "2": "No lo es."}, "n": ""}, {"id": 1055, "b": null, "g": 3, "t": "Tema 3 · Pared, membrana y transporte", "ch": "Pregunta nueva del temario", "q": "¿Cuál es la función de las capas S en las arqueas?", "o": ["Actúan como pared celular en las arqueas.", "Son la membrana externa de las arqueas.", "Almacenan energía en forma de gránulos.", "Son los flagelos de la superficie celular."], "a": 0, "ok": "En bacterias protegen frente a bacteriófagos y enzimas líticas y actúan como filtro selectivo.", "ko": {"1": "No lo son.", "2": "No lo hacen.", "3": "No lo son."}, "n": ""}, {"id": 1056, "b": null, "g": 3, "t": "Tema 3 · Pared, membrana y transporte", "ch": "Pregunta nueva del temario", "q": "¿Qué compuestos forman la unidad básica de la mureína?", "o": ["Solo glucosa polimerizada en largas cadenas.", "Disacárido NAM-NAG con un tetrapéptido de aminoácidos.", "Ácido teicoico unido al ribitol fosfato.", "Lípido A unido a azúcares de seis carbonos."], "a": 1, "ok": "Contiene D-aminoácidos, que no tenemos los humanos.", "ko": {"0": "No es así.", "2": "Es otro polímero de pared.", "3": "Es parte del LPS."}, "n": ""}, {"id": 1057, "b": null, "g": 3, "t": "Tema 3 · Pared, membrana y transporte", "ch": "Pregunta nueva del temario", "q": "¿Qué función tienen las lipoproteínas de Braun en Gram negativas?", "o": ["Transportan nutrientes al periplasma.", "Sintetizan las cadenas de mureína nueva en general.", "Anclan la membrana externa al peptidoglicano.", "Mueven el flagelo en el cuerpo basal."], "a": 2, "ok": "Sirven de punto de unión en el espacio periplásmico.", "ko": {"0": "Es de las permeasas.", "1": "No lo hacen.", "3": "No lo hacen."}, "n": ""}, {"id": 1058, "b": null, "g": 3, "t": "Tema 3 · Pared, membrana y transporte", "ch": "Pregunta nueva del temario", "q": "¿Qué son las porinas?", "o": ["Enzimas que sintetizan el LPS de la membrana.", "Un tipo de flagelo de las Gram negativas.", "Gránulos de reserva del citoplasma bacteriano de forma habitual.", "Trímeros proteicos que forman canales en la membrana externa."], "a": 3, "ok": "También son sitio de unión para bacteriófagos y pilus.", "ko": {"0": "No lo son.", "1": "No lo son.", "2": "No lo son."}, "n": ""}, {"id": 1059, "b": null, "g": 3, "t": "Tema 3 · Pared, membrana y transporte", "ch": "Pregunta nueva del temario", "q": "¿De qué está compuesta la pared celular de las micobacterias?", "o": ["Ácidos micólicos, impermeables a antibióticos.", "Pseudomureína, propia de algunas arqueas.", "Solo mureína, en una capa muy gruesa.", "Quitina, igual que la de los hongos."], "a": 0, "ok": "Son impermeables a antibióticos, de crecimiento lentísimo y se tiñen por Ziehl-Neelsen.", "ko": {"1": "Es de algunas arqueas.", "2": "Es distinta.", "3": "Es de hongos."}, "n": ""}, {"id": 1060, "b": null, "g": 3, "t": "Tema 3 · Pared, membrana y transporte", "ch": "Pregunta nueva del temario", "q": "¿Qué colorantes usa la tinción de Ziehl-Neelsen?", "o": ["Cristal violeta, lugol y safranina.", "Fuchina, alcohol-HCl y azul de metileno.", "Verde de malaquita y safranina.", "Solo azul de metileno sin decolorar en general."], "a": 1, "ok": "Identifica bacilos ácido-alcohol resistentes.", "ko": {"0": "Es la tinción de Gram.", "2": "Es Schaeffer-Fulton.", "3": "Es una tinción sencilla."}, "n": ""}, {"id": 1061, "b": null, "g": 3, "t": "Tema 3 · Pared, membrana y transporte", "ch": "Pregunta nueva del temario", "q": "¿Qué molécula de la membrana procariota aporta rigidez y es análoga a los esteroles?", "o": ["El colesterol, típico de eucariotas en general.", "El lípido A del lipopolisacárido.", "Los hopanoides, análogos a los esteroles.", "Las porinas de la membrana externa."], "a": 2, "ok": "Por eso las membranas procariotas son más flexibles que las eucariotas.", "ko": {"0": "Es de eucariotas.", "1": "Es del LPS.", "3": "Son proteínas."}, "n": ""}, {"id": 1062, "b": null, "g": 3, "t": "Tema 3 · Pared, membrana y transporte", "ch": "Pregunta nueva del temario", "q": "¿Por cuántos sitios pueden entrar los protones por la fuerza protón motriz?", "o": ["Solo uno: la ATPasa de la membrana.", "Dos: la ATPasa y la porina.", "Cuatro: ATPasa, permeasa, flagelo y pili.", "Tres: la ATPasa, las permeasas y el flagelo."], "a": 3, "ok": "Así se genera ATP, se transportan nutrientes y se mueve el flagelo.", "ko": {"0": "Hay otros dos.", "1": "No es uno de los tres.", "2": "No es uno de los tres."}, "n": ""}, {"id": 1063, "b": null, "g": 4, "t": "Tema 4 · Citoplasma, nucleoide y flagelos", "ch": "Pregunta nueva del temario", "q": "¿Qué antibióticos actúan sobre la subunidad 30S del ribosoma?", "o": ["Las tetraciclinas, que distorsionan la 30S.", "Los macrólidos, que se unen a la 50S.", "Los β-lactámicos, que inhiben la pared en general.", "Los azoles, que actúan sobre hongos."], "a": 0, "ok": "Bloquean la traducción al impedir que el anticodón se alinee con el codón. Los macrólidos se unen a la 50S.", "ko": {"1": "Actúan en la 50S.", "2": "Actúan sobre la pared.", "3": "No actúan sobre el ribosoma bacteriano."}, "n": ""}, {"id": 1064, "b": null, "g": 4, "t": "Tema 4 · Citoplasma, nucleoide y flagelos", "ch": "Pregunta nueva del temario", "q": "¿Para qué se utiliza el ARNr 16S?", "o": ["Sintetizar la pared celular bacteriana de forma habitual.", "Construir árboles filogenéticos de las bacterias.", "Fabricar los flagelos de la superficie.", "Transportar aminoácidos al ribosoma."], "a": 1, "ok": "Mide 1540 nucleótidos y tiene regiones conservadas e hipervariables.", "ko": {"0": "No lo hace.", "2": "No lo hace.", "3": "Eso lo hace el ARNt."}, "n": ""}, {"id": 1065, "b": null, "g": 4, "t": "Tema 4 · Citoplasma, nucleoide y flagelos", "ch": "Pregunta nueva del temario", "q": "¿Qué reserva de nitrógeno almacenan algunas cianobacterias?", "o": ["El glucógeno, polímero de glucosa.", "El polifosfato, reserva de fosfato.", "La cianoficina, polímero de arginina y aspártico.", "Los gránulos de azufre elemental."], "a": 2, "ok": "El glucógeno y los PHA son reservas de carbono y energía.", "ko": {"0": "Es de carbono.", "1": "Es de fósforo.", "3": "Son de azufre."}, "n": ""}, {"id": 1066, "b": null, "g": 4, "t": "Tema 4 · Citoplasma, nucleoide y flagelos", "ch": "Pregunta nueva del temario", "q": "¿Qué contienen los carboxisomas?", "o": ["Gas encerrado en una membrana proteica de forma habitual.", "Cristales de magnetita orientadores.", "Bacterioclorofilas y pigmentos antena.", "La RubisCO, para fijar CO2 en el ciclo de Calvin."], "a": 3, "ok": "Están en bacterias fotoautótrofas y quimioautótrofas.", "ko": {"0": "Son las vacuolas de gas.", "1": "Son los magnetosomas.", "2": "Son los clorosomas."}, "n": ""}, {"id": 1067, "b": null, "g": 4, "t": "Tema 4 · Citoplasma, nucleoide y flagelos", "ch": "Pregunta nueva del temario", "q": "¿Qué demostró Cairns en 1963 con timidina tritiada?", "o": ["Que el cromosoma es circular y se replica semiconservativamente.", "Que la replicación del cromosoma es conservativa.", "Que el cromosoma bacteriano es una molécula lineal de forma habitual.", "Que las bacterias carecen de ADN cromosómico."], "a": 0, "ok": "Usó autorradiografía.", "ko": {"1": "Es semiconservativa.", "2": "Es circular.", "3": "Sí lo tienen."}, "n": ""}, {"id": 1068, "b": null, "g": 4, "t": "Tema 4 · Citoplasma, nucleoide y flagelos", "ch": "Pregunta nueva del temario", "q": "¿Qué enzima sintetiza los iniciadores de ARN en la replicación?", "o": ["La ligasa, que une fragmentos de Okazaki.", "La primasa, que sintetiza iniciadores de ARN.", "La helicasa, que abre la doble hélice.", "La ADN polimerasa, que sintetiza en 5'→3'."], "a": 1, "ok": "La helicasa abre la doble hélice y la ligasa une los fragmentos de Okazaki.", "ko": {"0": "Une fragmentos de Okazaki.", "2": "Abre la hélice.", "3": "Sintetiza ADN en 5'→3'."}, "n": ""}, {"id": 1069, "b": null, "g": 4, "t": "Tema 4 · Citoplasma, nucleoide y flagelos", "ch": "Pregunta nueva del temario", "q": "¿Qué proteína forma el filamento del flagelo?", "o": ["La mureína de la pared celular.", "El LPS de la membrana externa.", "La flagelina, que forma el antígeno H.", "La pilina de los pili y fimbrias en general."], "a": 2, "ok": "El filamento es rígido, helicoidal y hueco.", "ko": {"0": "Es de la pared.", "1": "Es de la membrana externa.", "3": "Forma los pili."}, "n": ""}, {"id": 1070, "b": null, "g": 4, "t": "Tema 4 · Citoplasma, nucleoide y flagelos", "ch": "Pregunta nueva del temario", "q": "¿Qué proteínas del motor flagelar proporcionan la rotación en ambos sentidos?", "o": ["Las proteínas Mot, de la parte estática en general.", "La flagelina del filamento helicoidal.", "La mureína de la pared celular.", "Las proteínas Fli, de la parte móvil del motor."], "a": 3, "ok": "El cuerpo basal es el motor y usa la fuerza protón motriz.", "ko": {"0": "Forman la parte estática y generan la energía.", "1": "Forma el filamento.", "2": "No es del motor."}, "n": ""}, {"id": 1071, "b": null, "g": 4, "t": "Tema 4 · Citoplasma, nucleoide y flagelos", "ch": "Pregunta nueva del temario", "q": "¿Qué función tienen los pelos sexuales (pili)?", "o": ["Transferir ADN por conjugación entre células.", "Mover la bacteria en medios líquidos.", "Almacenar sustancias de reserva.", "Formar endosporas de resistencia."], "a": 0, "ok": "Las fimbrias adhesivas son numerosas y cortas.", "ko": {"1": "Es de los flagelos.", "2": "No lo hacen.", "3": "No lo hacen."}, "n": ""}, {"id": 1072, ón ácido-mixta y butanodiólica.", "ko": {"0": "No solo.", "1": "No tienen metabolismo.", "2": "Es otro metabolismo."}, "n": ""}, {"id": 1087, "b": null, "g": 8, "t": "Tema 8 · Metabolismo quimioautótrofo", "ch": "Pregunta nueva del temario", "q": "¿Cómo fijan el CO2 la mayoría de los autótrofos?", "o": ["Con el ciclo de Calvin-Benson.", "Con la glucólisis, que oxida la glucosa.", "Con la fermentación láctica o alcohólica.", "Con la respiración aerobia, que libera CO2."], "a": 0, "ok": "Los carboxisomas contienen la RubisCO.", "ko": {"1": "Es degradativa.", "2": "No fija CO2.", "3": "Oxida compuestos."}, "n": ""}, {"id": 1088, "b": null, "g": 8, "t": "Tema 8 · Metabolismo quimioautótrofo", "ch": "Pregunta nueva del temario", "q": "¿Qué producen las bacterias nitrosas y las nítricas?", "o": ["Las nitrosas forman nitrato; las nítricas, nitrito en general.", "Las nitrosas forman nitrito; las nítricas, nitrato.", "Ambas forman N2 como producto final.", "Ambas fijan el N2 atmosférico en amonio."], "a": 1, "ok": "Son bacterias nitrificantes y quimiolitoautótrofas.", "ko": {"0": "Es de las nítricas.", "2": "Eso es desnitrificación.", "3": "No es nitrificación."}, "n": ""}, {"id": 1089, "b": null, "g": 9, "t": "Tema 9 · Metabolismo fototrofo", "ch": "Pregunta nueva del temario", "q": "¿Qué dos fotosistemas usa la vía acíclica de las cianobacterias?", "o": ["Solo P840, propio de bacterias verdes.", "P870 y P840, de bacterias rojas y verdes.", "P700 y P680, con fotólisis del agua.", "Solo P680, sin intervención de otro."], "a": 2, "ok": "Producen ATP y NADPH con fotólisis del agua. La vía cíclica usa solo el P700.", "ko": {"0": "Es de bacterias verdes.", "1": "Son de bacterias rojas y verdes.", "3": "No es la vía acíclica."}, "n": ""}, {"id": 1090, "b": null, "g": 9, "t": "Tema 9 · Metabolismo fototrofo", "ch": "Pregunta nueva del temario", "q": "¿Qué ocurre en la vía cíclica de las cianobacterias?", "o": ["Fotólisis del agua y formación de NADPH.", "Fijación de CO2 en el cicl <script>
"use strict";
var BANK=JSON.parse(document.getElementById('bank').textContent), VARS=JSON.parse(document.getElementById('vars').textContent);
var BY={}; BANK.forEach(function(q){BY[q.id]=q;});
var VBY={}; VARS.forEach(function(v){ VBY[v.id]=v; });
var LET='ABCD', TEMAS=[]; BANK.forEach(function(q){ if(TEMAS.indexOf(q.t)<0) TEMAS.push(q.t); });
function $(i){return document.getElementById(i);}
function el(tag,cls,txt){ var e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }
function shuffled(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
var ICON_OK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.5"/></svg>';
var ICON_KO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg>';
var ICON_WARN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.01"/></svg>';
function ring(f,color){ var r=48,c=2*Math.PI*r; return '<svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="12"/><circle cx="60" cy="60" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+(c*f)+' '+c+'" transform="rotate(-90 60 60)"/></svg>'; }
function shortT(t){ return t.length>38? t.slice(0,37)+'…' : t; }

/* ---------- estado ---------- */
var KEY='farmaquiz.micro.v1';
function fresh(){ return {theme:'light',scope:'all',view:'p',ans:{},retry:{},flag:{},p:{tema:'all',mode:'all',pos:0,pending:null},sim:{cfg:{n:30,pen:0.33,min:45,mode:'cov'},hist:[],cur:null},rnd:null,vr:null,ui:{grid:true,weak:true}}; }
var ST=fresh(), mem=null;
try{ var raw=localStorage.getItem(KEY); if(raw) mem=JSON.parse(raw); }catch(e){}
if(mem){ var f=fresh(); for(var k in f){ ST[k]= (mem[k]!==undefined ? mem[k] : f[k]); } ['p','sim'].forEach(function(k){ for(var j in f[k]) if(ST[k][j]===undefined) ST[k][j]=f[k][j]; }); }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(ST)); }catch(e){} }
if(!ST.ui) ST.ui={grid:true,weak:true};
document.documentElement.setAttribute('data-theme',ST.theme);

/* ---------- utilidades ---------- */
function pool(){ return BANK.filter(function(q){ return ST.scope==='all' || String(q.b)===ST.scope; }); }
function isOk(q,i){ return i===q.a || (q.alt||[]).indexOf(i)>=0; }
function eff(id){ return ST.retry[id]? null : (ST.ans[id]||null); }
function failedIds(){ return pool().filter(function(q){ return ST.ans[q.id] && !ST.ans[q.id].c; }).map(function(q){return q.id;}); }
function cnt(t){ return pool().filter(function(q){return q.t===t;}).length; }
function updateFailBadge(){ var n=failedIds().length, b=$('failBadge'); b.textContent=n; b.classList.toggle('zero',n===0); }
function ask(title,text,yes,cb,no,danger){
  $('mT').textContent=title; $('mP').textContent=text; $('mYes').textContent=yes; $('mNo').textContent=no||'Cancelar';
  $('mYes').className='btn '+(danger?'danger':'primary'); $('modal').classList.add('on');
  $('mYes').onclick=function(){ $('modal').classList.remove('on'); cb(); }; $('mNo').onclick=function(){ $('modal').classList.remove('on'); };
}
function feedback(q,ans){
  var f=el('div','fb'), blank=ans.s===-1;
  var head=el('div','fb-head '+(blank?'bl':(ans.c?'ok':'ko')));
  head.innerHTML= blank?ICON_WARN:(ans.c?ICON_OK:ICON_KO);
  var alts=(q.alt||[]).map(function(i){return LET[i];}), both=alts.length?' (también válida: '+alts.join(', ')+')':'';
  head.appendChild(el('span',null, blank?'Sin responder · la correcta es la '+LET[q.a]+both : (ans.c?'¡Correcto!':'Incorrecto · la correcta es la '+LET[q.a]+both)));
  f.appendChild(head);
  var body=el('div','fb-body');
  body.appendChild(el('h3',null,'Por qué la '+LET[q.a]+' es correcta')); body.appendChild(el('p',null,q.ok));
  if(q.n){ var n=el('div','note'); n.innerHTML=ICON_WARN; var s=el('span'); s.appendChild(el('b',null,'Ojo · ')); s.appendChild(document.createTextNode(q.n.replace(/^Ojo · /,''))); n.appendChild(s); body.appendChild(n); }
  body.appendChild(el('h3',null,'Por qué las demás no'));
  var ul=el('ul','why');
  q.o.forEach(function(text,i){ if(i===q.a) return; var isAlt=(q.alt||[]).indexOf(i)>=0; var li=el('li',(i===ans.s&&!ans.c)?'picked':''); li.appendChild(el('span','l',LET[i])); var d=el('div'); d.appendChild(el('span','o',text+(isAlt?'  · también válida':''))); d.appendChild(document.createTextNode(q.ko[i]||'')); li.appendChild(d); ul.appendChild(li); });
  body.appendChild(ul); f.appendChild(body); return f;
}
function optList(q,res,pend,onPick){
  var ul=el('ul','opts');
  q.o.forEach(function(text,i){
    var li=el('li'), b=el('button','opt'); b.type='button';
    b.appendChild(el('span','ltr',LET[i])); b.appendChild(el('span','txt',text));
    if(res){ b.disabled=true; if(isOk(q,i)) b.classList.add('right'); else if(i===res.s) b.classList.add('wrong'); else b.classList.add('dim'); }
    else if(pend===i) b.classList.add('sel');
    b.addEventListener('click',function(){ if(!res) onPick(i); });
    li.appendChild(b); ul.appendChild(li);
  });
  return ul;
}

/* ================= PRACTICAR ================= */
function plist(){
  var P=ST.p;
  return pool().filter(function(q){
    if(P.tema!=='all' && q.t!==P.tema) return false;
    var a=ST.ans[q.id];
    if(P.mode==='new') return !a;
    if(P.mode==='fail') return (P.snap||failedIds()).indexOf(q.id)>=0;
    if(P.mode==='flag') return !!ST.flag[q.id];
    return true;
  }).map(function(q){return q.id;});

    var r=ST[cfg.key],id=r.order[r.pos]; if(r.res[id]||!r.pending||r.pending.id!==id) return;

    if(cfg.counts){ ST.ans[id]={s:orig,c:ok}; delete ST.retry[id]; }
    r.pending=null; save(); updateFailBadge(); render();
    var fb=document.querySelector('#'+cfg.root+' .fb'); if(fb&&fb.scrollIntoView) fb.scrollIntoView({behavior:'smooth',block:'nearest'});
  }
  function go(i){ var r=ST[cfg.key]; if(i<0||i>=r.order.length) return; r.pos=i; r.pending=null; save(); render(); window.scrollTo({top:0,behavior:'smooth'}); }
  function render(){
    var root=$(cfg.root); root.textContent=''; root.appendChild(el('h2','sim-h',cfg.name)); root.appendChild(el('p','sim-p',cfg.intro));
    var r=ST[cfg.key], bar=el('div','controls'), sel=el('select'); sel.setAttribute('aria-label','Tema');
    var items=cfg.items(), o0=el('option',null,'Todos los temas ('+items.length+')'); o0.value='all'; sel.appendChild(o0);
    TEMAS.forEach(function(t){ var n=items.filter(function(q){return q.t===t;}).length; if(!n) return; var op=el('option',null,t+' ('+n+')'); op.value=t; sel.appendChild(op); });
    sel.value=temaSel; sel.addEventListener('change',function(){ temaSel=sel.value; }); bar.appendChild(sel);
    var nb=el('button','btn primary',r?'Nueva ronda':'Empezar ronda'); nb.addEventListener('click',function(){ if(r&&!r.sum&&Object.keys(r.res).length) ask('¿Empezar una ronda nueva?','Se descartará la ronda actual ('+Object.keys(r.res).length+' respondidas).','Sí, nueva ronda',newRound,'Cancelar',false); else newRound(); }); bar.appendChild(nb); root.appendChild(bar);
    if(!r){ var e=el('div','card empty'); e.appendChild(el('h2',null,'Listo para una ronda')); e.appendChild(el('p',null,'Elige el tema (o todos) y pulsa «Empezar ronda». Cada ronda cambia el orden de preguntas y de opciones.')); root.appendChild(e); return; }
    var c=counts(), pc=el('section','card'), top=el('div','progress-top');
    top.appendChild(el('strong',null,r.sum?'Ronda terminada':'Pregunta '+(r.pos+1)+' de '+c.n)); top.appendChild(el('small',null,c.ok+' aciertos · '+c.ko+' fallos · '+(c.n-c.done)+' pendientes')); pc.appendChild(top);
    var br=el('div','bar'),bo=el('i','b-ok'); bo.style.width=(c.ok*100/c.n)+'%'; var bk=el('i','b-ko'); bk.style.width=(c.ko*100/c.n)+'%'; br.appendChild(bo); br.appendChild(bk); pc.appendChild(br); root.appendChild(pc);
    if(r.sum){
      var pct=c.done?Math.round(c.ok*100/c.done):0, hero=el('section','card hero'), rb=el('div','ringbox'); rb.innerHTML=ring(c.done?c.ok/c.done:0,pct>=50?'var(--ok)':'var(--ko)');
      var rn=el('div','n'); rn.appendChild(el('b',null,pct+'%')); rn.appendChild(el('span',null,'de acierto')); rb.appendChild(rn); hero.appendChild(rb);
      var tx=el('div','tx'); tx.appendChild(el('h2',null,c.ok+' de '+c.n+' correctas')); tx.appendChild(el('p',null,c.ko+' fallos · '+(c.n-c.done)+' sin contestar')); hero.appendChild(tx); root.appendChild(hero);
      var al=el('div','rline'); var nw=el('button','btn primary','Nueva ronda'); nw.addEventListener('click',newRound); al.appendChild(nw);
      var rv=el('button','btn ghost','Revisar la ronda'); rv.addEventListener('click',function(){ r.sum=false; r.pos=0; save(); render(); window.scrollTo({top:0}); }); al.appendChild(rv);
      if(cfg.counts&&c.ko){ var ff=el('button','btn ghost','Ver mis fallos'); ff.addEventListener('click',function(){ setView('f'); }); al.appendChild(ff); }
      root.appendChild(al); return;
    }
    var id=r.order[r.pos], v=view(id), res=r.res[id], pend=r.pending&&r.pending.id===id?r.pending.sel:null;
    var card=el('article','card qcard x'), meta=el('div','qmeta'); meta.appendChild(el('span','tag',v.t)); meta.appendChild(el('span','qnum',cfg.label(id))); card.appendChild(meta);
    card.appendChild(el('h2','qtext',v.q));
    var res2=res?{s:v.perm.indexOf(res.s),c:res.c}:null;
    card.appendChild(optList(v,res2,pend,choose));
    if(v.fixed){ card.appendChild(el('p','hint','En esta pregunta las opciones no se barajan, porque se refieren unas a otras.')); }
    var act=el('div','actions'), pv=el('button','btn ghost','← Anterior'); pv.disabled=r.pos===0; pv.addEventListener('click',function(){ go(r.pos-1); }); act.appendChild(pv); act.appendChild(el('span','sp'));
    if(!res){ var ck=el('button','btn primary','Comprobar'); ck.disabled=pend==null; ck.addEventListener('click',check); act.appendChild(ck); }
    var last=r.pos>=c.n-1, nx=el('button','btn '+(res?'primary':'ghost'),last?'Ver resultado':'Siguiente →');
    nx.addEventListener('click',function(){ if(last){ r.sum=true; save(); render(); window.scrollTo({top:0}); } else go(r.pos+1); }); act.appendChild(nx); card.appendChild(act);
    if(res){ var f=feedback(v,res2); if(cfg.extra){ var body=f.querySelector('.fb-body'); if(body) body.insertBefore(cfg.extra(id),body.firstChild); } card.appendChild(f); }
    root.appendChild(card);
  }
  function key(e){
    var r=ST[cfg.key]; if(!r||r.sum) return false; var id=r.order[r.pos],v=view(id),k=e.key.toLowerCase(),ix='abcde'.indexOf(k),done=r.res[id];
    if(k.length===1&&ix>=0&&ix<v.o.length&&!done){ choose(ix); return true; }
    if(/^[1-5]$/.test(k)&&+k<=v.o.length&&!done){ choose(+k-1); return true; }
    if(e.key==='Enter'){ if(!done) check(); else if(r.pos<r.order.length-1) go(r.pos+1); else { r.sum=true; save(); render(); } return true; }
    if(e.key==='ArrowRight'){ go(r.pos+1); return true; } if(e.key==='ArrowLeft'){ go(r.pos-1); return true; } return false;
  }
  return {render:render,valid:valid,key:key};
}
var RND=mkRound({key:'rnd',root:'viewR',counts:true,name:'Aleatorio total',
  intro:'Todas las preguntas en orden aleatorio y con las opciones barajadas, para que no memorices en qué letra está la respuesta. Tus aciertos y fallos cuentan en tu progreso y en «Fallos».',
  src:function(id){return BY[id];},items:function(){return pool();},label:function(id){return 'Banco · nº '+id;}});
var VAR=mkRound({key:'vr',root:'viewV',counts:false,name:'Variantes',
  intro:'Preguntas del banco con el enunciado modificado (de «es» a «NO es», otra pregunta sobre el mismo dato…) para que la respuesta correcta cambie, y preguntas nuevas sacadas de los apuntes que no estaban en el cuestionario. Sirven por si el profesor cambia las preguntas. No cuentan en tu progreso. Opciones barajadas.',
  src:function(id){return VBY[id];},
  items:function(){ return VARS.filter(function(v){ return ST.scope==='all'||String(v.g)===ST.scope; }); },
  label:function(id){return VBY[id].b?'Variante del nº '+VBY[id].b:'Pregunta nueva del temario';},
  extra:function(id){ var q=VBY[id],b=q.b?BY[q.b]:null,d=el('div','note'); d.innerHTML=ICON_WARN; var s=el('span'); if(!b){ s.appendChild(el('b',null,'Pregunta nueva · ')); s.appendChild(document.createTextNode('Sacada de los apuntes, no estaba en el cuestionario original.')); } else { s.appendChild(el('b',null,'Qué cambió · ')); s.appendChild(document.createTextNode(q.ch+'. ')); s.appendChild(el('b',null,'Pregunta original (nº '+b.id+'): ')); s.appendChild(document.createTextNode(b.q+' → '+b.o[b.a])); } d.appendChild(s); return d; }});

/* ================= FALLOS ================= */
function renderF(){
  var root=$('viewF'); root.textContent=''; var ids=failedIds();
  root.appendChild(el('h2','sim-h','Mis fallos')); root.appendChild(el('p','sim-p','Todas las preguntas que has fallado por última vez, con la respuesta correcta y la explicación, para leerlas y no repetir el error.'));
  if(!ids.length){ var e=el('div','card empty'); e.appendChild(el('h2',null,'Sin fallos pendientes')); e.appendChild(el('p',null,'Cuando falles preguntas en cualquier pestaña aparecerán aquí.')); root.appendChild(e); return; }
  var al=el('div','rline'); var pb=el('button','btn primary','Reintentarlas ('+ids.length+')'); pb.addEventListener('click',function(){ ids.forEach(function(id){ ST.retry[id]=true; }); ST.p.mode='fail'; ST.p.snap=ids.slice(); ST.p.tema='all'; ST.p.pos=0; ST.p.pending=null; save(); setView('p'); }); al.appendChild(pb); root.appendChild(al);
  TEMAS.forEach(function(t){
    var g=ids.filter(function(id){return BY[id].t===t;}); if(!g.length) return;
    root.appendChild(el('h2',null,t+' ('+g.length+')'));
    g.forEach(function(id){
      var q=BY[id], a=ST.ans[id], d=el('details','rv'), s=el('summary'); s.appendChild(el('span','st ko','✕')); s.appendChild(el('span',null,q.q)); d.appendChild(s);
      var b=el('div','rvb'); b.appendChild(optList(q,a,null,function(){})); b.appendChild(feedback(q,a)); d.appendChild(b); root.appendChild(d);
    });
  });
}

/* ================= vistas y eventos ================= */
function applyView(){
  var v=ST.view; if('psrvf'.indexOf(v)<0) v='p';
  ['P','S','R','V','F'].forEach(function(k){ var on=(v===k.toLowerCase()); $('view'+k).hidden=!on; $('tab'+k).setAttribute('aria-selected',String(on)); });
  $('liveDot').classList.toggle('on',!!ST.sim.cur); updateFailBadge();
  if(v==='p') renderP(); if(v==='s') renderS(); if(v==='r') RND.render(); if(v==='v') VAR.render(); if(v==='f') renderF();
}
function setView(v){ ST.view=v; save(); applyView(); window.scrollTo({top:0}); }
['P','S','R','V','F'].forEach(function(k){ $('tab'+k).addEventListener('click',function(){ setView(k.toLowerCase()); }); });
var sc=$('scope'); [['all','Todo el material (81 preguntas)'],['1','Tema 1'],['2','Tema 2'],['3','Tema 3'],['4','Tema 4'],['5','Tema 5'],['6','Tema 6'],['7','Tema 7'],['8','Tema 8'],['9','Tema 9']].forEach(function(o){ var op=el('option',null,o[1]); op.value=o[0]; sc.appendChild(op); });
sc.value=ST.scope; sc.addEventListener('change',function(){ ST.scope=sc.value; ST.p.pos=0; ST.p.pending=null; ST.p.tema='all'; ST.rnd=null; ST.vr=null; save(); applyView(); });
$('btnTheme').addEventListener('click',function(){ ST.theme=ST.theme==='dark'?'light':'dark'; document.documentElement.setAttribute('data-theme',ST.theme); save(); });
$('btnReset').addEventListener('click',function(){ ask('¿Reiniciar todo el progreso?','Se borrarán tus respuestas, marcas, simulacros e historial.','Sí, reiniciar',function(){ var th=ST.theme; ST=fresh(); ST.theme=th; sv='start'; stopTimer(); save(); sc.value='all'; applyView(); },'Cancelar',true); });
if(ST.rnd&&!RND.valid()) ST.rnd=null; if(ST.vr&&!VAR.valid()) ST.vr=null;
if(ST.sim.cur){ var bad=ST.sim.cur.order.some(function(id){return !BY[id];}); if(bad) ST.sim.cur=null; else { sv='exam'; if(ST.view==='s') startTimer(); } }
document.addEventListener('keydown',function(e){
  if(e.ctrlKey||e.metaKey||e.altKey) return; if($('modal').classList.contains('on')){ if(e.key==='Escape') $('modal').classList.remove('on'); return; }
  var tg=e.target&&e.target.tagName; if(tg==='SELECT'||tg==='INPUT') return;
  var h=false;
  if(ST.view==='r') h=RND.key(e); else if(ST.view==='v') h=VAR.key(e);
  else if(ST.view==='s'&&sv==='exam'&&ST.sim.cur){ var c=ST.sim.cur,id=c.order[c.pos],q=BY[id],k=e.key.toLowerCase(),ix='abcde'.indexOf(k);
    if(k.length===1&&ix>=0&&ix<q.o.length){ if(c.ans[id]===ix) delete c.ans[id]; else c.ans[id]=ix; save(); renderS(); h=true; }
    else if(e.key==='ArrowRight'&&c.pos<c.order.length-1){ c.pos++; save(); renderS(); h=true; } else if(e.key==='ArrowLeft'&&c.pos>0){ c.pos--; save(); renderS(); h=true; } }
  else if(ST.view==='p'){ var list=plist(),pid=list[ST.p.pos]; if(pid==null) return; var q2=BY[pid],k2=e.key.toLowerCase(),i2='abcde'.indexOf(k2),a2=eff(pid);
    if(k2.length===1&&i2>=0&&i2<q2.o.length&&!a2){ ST.p.pending={id:pid,sel:i2}; save(); renderP(); h=true; }
    else if(/^[1-5]$/.test(k2)&&+k2<=q2.o.length&&!a2){ ST.p.pending={id:pid,sel:+k2-1}; save(); renderP(); h=true; }
    else if(e.key==='Enter'){ if(!a2) pCheck(); else pGo(ST.p.pos+1); h=true; }
    else if(e.key==='ArrowRight'){ pGo(ST.p.pos+1); h=true; } else if(e.key==='ArrowLeft'){ pGo(ST.p.pos-1); h=true; } }
  if(h) e.preventDefault();
});
applyView();
